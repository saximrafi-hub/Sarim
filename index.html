                      lines.push([t.learnerName,t.learnerEmail,t.courseName,t.status,t.completionDate||'',t.expiryDate||'',t.score!=null?t.score:'',cert?cert.certNumber:''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
                    });
                    downloadCSV(`${company.name}-progress-matrix.csv`,lines.join('\n'));
                  }}><I n="dl" s={12}/> Export</button>
                  <button className="btn btn-coral btn-sm" onClick={()=>setShowImport(true)}><I n="upload" s={12}/> Import More</button>
                </div>
                <div style={{overflowX:'auto'}}>
                  <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                    <thead style={{background:'var(--peach)'}}>
                      <tr>{['Learner','Course','Status','Completion','Expiry','Score','Certificate'].map(h=><th key={h} style={{padding:'10px 14px',textAlign:'left',fontWeight:700,color:'var(--espresso)',fontSize:11,textTransform:'uppercase',letterSpacing:.3}}>{h}</th>)}</tr>
                    </thead>
                    <tbody>
                      {filtered.length===0?(<tr><td colSpan={7} style={{padding:'24px',textAlign:'center',color:'var(--wg2)'}}>No matching records</td></tr>):filtered.map(t=>{
                        const cert=(company.certificates||[]).find(c=>c.id===t.certId);
                        const stCls=t.status==='Complete'?'b-active':t.status==='Expired'?'b-churned':t.status==='Failed'?'b-overdue':t.status==='In Progress'?'b-pending':'b-freeze';
                        return(
                          <tr key={t.id} style={{borderTop:'1px solid #F1F5F9'}}>
                            <td style={{padding:'10px 14px'}}>
                              <div style={{fontWeight:600,color:'var(--espresso)'}}>{t.learnerName}</div>
                              <div style={{fontSize:10,color:'var(--wg2)'}}>{t.learnerEmail}</div>
                            </td>
                            <td style={{padding:'10px 14px',color:'var(--espresso)'}}>{t.courseName}</td>
                            <td style={{padding:'10px 14px'}}><span className={`badge ${stCls}`} style={{fontSize:10}}>{t.status}</span></td>
                            <td style={{padding:'10px 14px',color:'var(--wg2)'}}>{t.completionDate?new Date(t.completionDate+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—'}</td>
                            <td style={{padding:'10px 14px',color:t.expiryDate&&t.expiryDate<new Date().toISOString().slice(0,10)?'#DC2626':'var(--wg2)'}}>{t.expiryDate?new Date(t.expiryDate+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—'}</td>
                            <td style={{padding:'10px 14px',color:'var(--wg2)'}}>{t.score!=null?`${t.score}%`:'—'}</td>
                            <td style={{padding:'10px 14px'}}>
                              {cert?(<div><div style={{fontWeight:600,fontSize:11,color:'var(--espresso)'}}>{cert.certNumber}</div><span className={`badge ${cert.status==='Active'?'b-active':'b-churned'}`} style={{fontSize:9,marginTop:2}}>{cert.status}</span></div>):<span style={{fontSize:11,color:'var(--wg2)'}}>—</span>}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>

              {importModal}
            </div>
          );
        })()}

        {tab==='activity' && (
          <div className="card">
            <div style={{padding:'14px 18px',borderBottom:'1px solid var(--border)'}}><span className="ct-title">Activity Log</span></div>
            <div style={{padding:'12px 18px'}}>
              {[
                {text:`Account created with ${company.pkg} package`,time:company.created,i:'co',bg:'rgba(59,130,246,.1)',fc:'#1E40AF'},
                {text:`Invoice ${company.xeroId} sent via Xero`,time:company.created,i:'inv',bg:'rgba(26,181,163,.1)',fc:'#1AB5A3'},
              ].map((e,i)=>(
                <div key={i} className="act-entry">
                  <div className="act-icon" style={{background:e.bg,color:e.fc}}><I n={e.i} s={13}/></div>
                  <div className="act-body"><div className="act-text">{e.text}</div><div className="act-time">{e.time}</div></div>
                </div>
              ))}
            </div>
          </div>
        )}

        {tab==='notes' && (
          <div>
            <div className="card" style={{marginBottom:12}}>
              <div style={{padding:'14px 18px',borderBottom:'1px solid var(--border)'}}><span className="ct-title">Add Note</span></div>
              <div style={{padding:'16px 18px',display:'flex',gap:10}}>
                <textarea className="fta" style={{flex:1}} placeholder="Add an internal note about this company…" value={noteText} onChange={e=>setNoteText(e.target.value)}/>
                <button className="btn btn-coral" style={{alignSelf:'flex-end'}} onClick={addNote}><I n="note" s={14}/> Save Note</button>
              </div>
            </div>
            <div>
              {(company.notes||[]).length===0 ? <div className="empty">No notes yet. Add one above.</div> :
                (company.notes||[]).filter(n=>n.text).map((n,i)=>(
                  <div key={i} className="note-item">
                    <div className="note-meta">{n.author} · {n.date}</div>
                    <div className="note-text">{n.text}</div>
                  </div>
                ))
              }
            </div>
          </div>
        )}
      </div>
      {showPay && <AddPaymentModal company={company} onClose={()=>setShowPay(false)} onSave={savePayment}/>}
    </>
  );
}

/* ── RENEWALS SCREEN ── */
function Renewals({companies,addToast}){
  const [tab,setTab]=useState('upcoming');
  const [window30,setWindow30]=useState(30);
  const [sent,setSent]=useState({});

  const today=new Date();
  const daysUntil=(dateStr)=>{
    if(!dateStr)return 9999;
    return Math.round((new Date(dateStr)-today)/(1000*60*60*24));
  };
  const isOverdue=(c)=>c.payment==='Overdue'&&c.status!=='Churned';
  const isUpcoming=(c,days)=>{ const d=daysUntil(c.contractEnd); return d>=0&&d<=days&&c.status!=='Churned'; };
  const isCompleted=(c)=>c.payment==='Paid'&&c.contractEnd&&new Date(c.contractEnd)>today;

  const upcomingList=companies.filter(c=>isUpcoming(c,window30));
  const overdueList=companies.filter(c=>isOverdue(c));
  const completedList=companies.filter(c=>isCompleted(c)).slice(0,20);

  const renewalValue=(c)=>{
    if(c.pkg==='CC') return (c.credits*15).toFixed(2);
    if(c.sub==='Annual') return (c.seats*35).toFixed(2);
    return (c.seats*3.5).toFixed(2);
  };

  const sendInvoice=(c)=>{
    const id=`INV-${3000+Math.floor(Math.random()*999)}`;
    setSent(s=>({...s,[c.id]:id}));
    addToast({msg:`Renewal invoice ${id} sent via Xero — ${c.name}`,type:'xero'});
  };

  const sendBulk=(list)=>{
    list.forEach(c=>{ if(!sent[c.id]) sendInvoice(c); });
  };

  const tabs=[
    {id:'upcoming',label:'Upcoming',count:upcomingList.length,color:'#92400E',bg:'#FEF3C7'},
    {id:'overdue',label:'Overdue',count:overdueList.length,color:'#991B1B',bg:'#FEE2E2'},
    {id:'completed',label:'Completed',count:completedList.length,color:'#065F46',bg:'#D1FAE5'},
  ];

  const RenewalRow=({c})=>{
    const days=daysUntil(c.contractEnd);
    const val=renewalValue(c);
    const isSent=!!sent[c.id];
    return (
      <tr>
        <td>
          <div style={{fontWeight:600,color:'var(--espresso)',fontSize:13}}>{c.name}</div>
          <div style={{fontSize:11,color:'var(--wg2)',marginTop:2}}>ID #{c.id}</div>
        </td>
        <td>
          <span className={`badge ${c.pkg==='CP'?'b-cp':c.pkg==='CC'?'b-cc':'b-both'}`}>{c.pkg}</span>
          <span style={{fontSize:11,color:'var(--wg2)',marginLeft:6}}>{c.sub}</span>
        </td>
        <td>
          {(c.pkg==='CP'||c.pkg==='CP & CC') && <div style={{fontSize:12,color:'var(--wg1)'}}><strong>{c.seats}</strong> seats ({c.seatsUsed} used)</div>}
          {(c.pkg==='CC'||c.pkg==='CP & CC') && <div style={{fontSize:12,color:'var(--wg1)',marginTop:2}}><strong>{c.credits}</strong> credits ({c.creditsUsed} used)</div>}
        </td>
        <td style={{fontWeight:700,color:'var(--espresso)',fontSize:14}}>£{val}</td>
        <td>
          {tab==='overdue'
            ? <span className="badge b-overdue">Overdue {Math.abs(days)}d</span>
            : tab==='upcoming'
              ? <span className="badge b-pending">{days===0?'Today':days===1?'Tomorrow':`${days} days`}</span>
              : <span className="badge b-active">Paid</span>
          }
        </td>
        <td style={{fontSize:12,color:'var(--wg2)'}}>{c.contractEnd||'—'}</td>
        <td>
          {tab!=='completed' && (
            isSent
              ? <span style={{fontSize:12,color:'#1AB5A3',fontWeight:600,display:'flex',alignItems:'center',gap:4}}><I n="check" s={12}/>Sent {sent[c.id]}</span>
              : <button className="btn btn-coral btn-sm" onClick={()=>sendInvoice(c)}><I n="inv" s={12}/> Send Invoice</button>
          )}
          {tab==='completed' && <span style={{fontSize:12,color:'var(--wg2)'}}>{c.xeroId}</span>}
        </td>
      </tr>
    );
  };

  const activeList = tab==='upcoming'?upcomingList:tab==='overdue'?overdueList:completedList;
  const totalValue = activeList.reduce((s,c)=>s+parseFloat(renewalValue(c)),0);

  return (
    <div className="content">
      {/* summary strip */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:20}}>
        <div className="stat-card" style={{borderTop:'3px solid #F59E0B'}}>
          <div className="sc-label">Due in 30 Days</div>
          <div className="sc-val">{companies.filter(c=>isUpcoming(c,30)).length}</div>
          <div className="sc-change sc-neg">£{companies.filter(c=>isUpcoming(c,30)).reduce((s,c)=>s+parseFloat(renewalValue(c)),0).toLocaleString('en-GB',{minimumFractionDigits:2})} at risk</div>
        </div>
        <div className="stat-card" style={{borderTop:'3px solid #EF4444'}}>
          <div className="sc-label">Overdue Renewals</div>
          <div className="sc-val">{overdueList.length}</div>
          <div className="sc-change sc-neg">£{overdueList.reduce((s,c)=>s+parseFloat(renewalValue(c)),0).toLocaleString('en-GB',{minimumFractionDigits:2})} outstanding</div>
        </div>
        <div className="stat-card" style={{borderTop:'3px solid #10B981'}}>
          <div className="sc-label">Renewals This Quarter</div>
          <div className="sc-val">{completedList.length}</div>
          <div className="sc-change sc-pos">£{completedList.reduce((s,c)=>s+parseFloat(renewalValue(c)),0).toLocaleString('en-GB',{minimumFractionDigits:2})} collected</div>
        </div>
      </div>

      <div className="card">
        {/* tab bar + actions */}
        <div style={{padding:'14px 20px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
          <div style={{display:'flex',gap:0,border:'1px solid var(--border)',borderRadius:'var(--r6)',overflow:'hidden'}}>
            {tabs.map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:'7px 16px',border:'none',borderRight:'1px solid var(--border)',cursor:'pointer',fontFamily:'var(--font)',fontSize:13,fontWeight:600,background:tab===t.id?'var(--coral)':'#fff',color:tab===t.id?'var(--espresso)':'var(--wg2)',display:'flex',alignItems:'center',gap:6,transition:'all .12s'}}>
                {t.label}
                {t.count>0 && <span style={{background:tab===t.id?'rgba(53,41,38,.2)':t.bg,color:tab===t.id?'var(--espresso)':t.color,borderRadius:99,padding:'1px 6px',fontSize:11}}>{t.count}</span>}
              </button>
            ))}
          </div>

          {tab==='upcoming' && (
            <div style={{display:'flex',gap:6,marginLeft:'auto',alignItems:'center'}}>
              <span style={{fontSize:12,color:'var(--wg2)',fontWeight:500}}>Show due in:</span>
              {[30,60,90].map(d=>(
                <button key={d} onClick={()=>setWindow30(d)} style={{padding:'5px 12px',border:`1px solid ${window30===d?'var(--coral)':'var(--border)'}`,borderRadius:'var(--r6)',background:window30===d?'rgba(255,143,105,.1)':'#fff',color:window30===d?'var(--espresso)':'var(--wg2)',fontFamily:'var(--font)',fontSize:12,fontWeight:600,cursor:'pointer'}}>{d}d</button>
              ))}
              {upcomingList.length>0 && <button className="btn btn-coral btn-sm" style={{marginLeft:8}} onClick={()=>sendBulk(upcomingList)}><I n="inv" s={12}/> Bulk Send ({upcomingList.filter(c=>!sent[c.id]).length})</button>}
            </div>
          )}
          {tab==='overdue' && overdueList.length>0 && (
            <div style={{marginLeft:'auto'}}>
              <button className="btn btn-coral btn-sm" onClick={()=>sendBulk(overdueList)}><I n="inv" s={12}/> Bulk Send All ({overdueList.filter(c=>!sent[c.id]).length})</button>
            </div>
          )}
          {tab!=='overdue' && tab!=='upcoming' && <div style={{marginLeft:'auto'}}/>}
        </div>

        {/* xero badge */}
        <div style={{padding:'10px 20px',background:'#F0FDFA',borderBottom:'1px solid #CCFBF1',display:'flex',alignItems:'center',gap:8,fontSize:12,color:'#0F766E'}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:'#1AB5A3',flexShrink:0}}/>
          <span>Invoices are sent directly through <strong>Xero</strong> — auto-generated with company details and renewal amount</span>
          {activeList.length>0 && <span style={{marginLeft:'auto',fontWeight:700,color:'#0F766E'}}>Total renewal value: £{totalValue.toLocaleString('en-GB',{minimumFractionDigits:2})}</span>}
        </div>

        {activeList.length===0 ? (
          <div className="empty" style={{padding:'60px 24px'}}>
            {tab==='upcoming' ? `No renewals due within ${window30} days 🎉` : tab==='overdue' ? 'No overdue renewals 🎉' : 'No completed renewals this quarter'}
          </div>
        ) : (
          <table className="tbl">
            <thead>
              <tr>
                <th>Company</th>
                <th>Plan</th>
                <th>Seats / Credits</th>
                <th>Renewal Value</th>
                <th>Status</th>
                <th>Contract End</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              {activeList.map(c=><RenewalRow key={c.id} c={c}/>)}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

/* ── GLOBAL PACKAGES SCREEN ── */
function Packages({companies,onNav,openCompany}){
  const [tab,setTab]=useState('all'); // 'all' | 'cp' | 'cc'
  const [statusFilter,setStatusFilter]=useState('all');
  const [companyFilter,setCompanyFilter]=useState('all');
  const [search,setSearch]=useState('');

  // Build a flat package list across all companies using new packages structure
  // CP: 1 row per company (1 CP package max), CC: 1 row per top-up (each is its own package)
  const allPackages=[];
  companies.forEach(c=>{
    const pkgs=c.packages||[];

    // CP Package — exactly 1 per company
    const cpPkg=pkgs.find(p=>p.planType==='CP');
    if(cpPkg){
      const activeCp=cpPkg.payments?.find(p=>p.planStatus==='Active');
      const scheduledCp=cpPkg.payments?.find(p=>p.planStatus==='Scheduled');
      allPackages.push({
        company:c, planType:'CP', pkgId:'cp',
        status:scheduledCp?'Scheduled':activeCp?'Active':cpPkg.status==='Expired'?'Expired':'Inactive',
        seats:cpPkg.seats||c.seats, used:c.seatsUsed, billing:cpPkg.billingCycle||c.sub,
        contractStart:cpPkg.contractStart||c.contractStart,
        contractEnd:cpPkg.contractEnd||c.contractEnd,
        revenue:cpPkg.payments?.reduce((s,p)=>s+(p.amount||0),0)||0,
        paymentsCount:cpPkg.payments?.length||0,
        latestXeroId:cpPkg.payments?.[0]?.xeroId,
      });
    }

    // CC Packages — one row per top-up purchase
    pkgs.filter(p=>p.planType==='CC').forEach(ccPkg=>{
      const payStatus=ccPkg.paymentStatus||'Pending';
      allPackages.push({
        company:c, planType:'CC', pkgId:ccPkg.id,
        status:payStatus==='Paid'?'Active':payStatus==='Overdue'?'Overdue':'Pending',
        credits:ccPkg.qty, used:0,
        contractStart:ccPkg.date, contractEnd:null,
        revenue:ccPkg.amount||0,
        paymentsCount:1,
        latestXeroId:ccPkg.xeroId,
        paymentStatus:payStatus,
      });
    });
  });

  // Filter
  let filtered=allPackages.filter(p=>{
    if(tab!=='all'&&p.planType!==tab.toUpperCase()) return false;
    if(statusFilter!=='all'&&p.status!==statusFilter) return false;
    if(companyFilter!=='all'&&p.company.id!==+companyFilter) return false;
    if(search&&!p.company.name.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  const counts={
    all:allPackages.length,
    cp:allPackages.filter(p=>p.planType==='CP').length,
    cc:allPackages.filter(p=>p.planType==='CC').length,
  };

  const totalRevenue=filtered.reduce((s,p)=>s+p.revenue,0);
  const activePackages=filtered.filter(p=>p.status==='Active').length;

  return (
    <div className="content">
      {/* summary cards */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14,marginBottom:20}}>
        <div className="analytic-card">
          <div className="kpi-label">Total Packages</div>
          <div className="kpi-val" style={{fontSize:24}}>{counts.all}</div>
          <div className="kpi-sub">across {companies.length} companies</div>
        </div>
        <div className="analytic-card" style={{borderLeft:'3px solid var(--coral)'}}>
          <div className="kpi-label">CP Packages</div>
          <div className="kpi-val" style={{fontSize:24,color:'#B94A2A'}}>{counts.cp}</div>
          <div className="kpi-sub">Care Professional</div>
        </div>
        <div className="analytic-card" style={{borderLeft:'3px solid var(--blue)'}}>
          <div className="kpi-label">CC Packages</div>
          <div className="kpi-val" style={{fontSize:24,color:'#1E40AF'}}>{counts.cc}</div>
          <div className="kpi-sub">Care Certificate</div>
        </div>
        <div className="analytic-card" style={{borderLeft:'3px solid var(--green)'}}>
          <div className="kpi-label">Active Packages</div>
          <div className="kpi-val" style={{fontSize:24,color:'#065F46'}}>{activePackages}</div>
          <div className="kpi-sub">{fmtGBP(totalRevenue)} total revenue</div>
        </div>
      </div>

      <div className="card">
        <div className="card-toolbar" style={{padding:'14px 20px',gap:10}}>
          {/* tab toggles */}
          <div style={{display:'flex',gap:0,border:'1px solid var(--border)',borderRadius:'var(--r6)',overflow:'hidden'}}>
            {[['all','All',counts.all],['cp','CP',counts.cp],['cc','CC',counts.cc]].map(([v,l,c])=>(
              <button key={v} onClick={()=>setTab(v)} style={{padding:'7px 16px',border:'none',borderRight:v!=='cc'?'1px solid var(--border)':'none',cursor:'pointer',fontFamily:'var(--font)',fontSize:13,fontWeight:600,background:tab===v?'var(--coral)':'#fff',color:tab===v?'var(--espresso)':'var(--wg2)',display:'flex',alignItems:'center',gap:6}}>
                {l}<span style={{background:tab===v?'rgba(53,41,38,.2)':'#F3F4F6',color:tab===v?'var(--espresso)':'var(--wg2)',borderRadius:99,padding:'1px 6px',fontSize:11}}>{c}</span>
              </button>
            ))}
          </div>

          <input className="search" placeholder="Search company..." value={search} onChange={e=>setSearch(e.target.value)} style={{minWidth:200}}/>

          <select className="sel" value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
            <option value="all">All Statuses</option>
            <option value="Active">Active / Paid</option>
            <option value="Scheduled">Scheduled</option>
            <option value="Overdue">Overdue</option>
            <option value="Pending">Pending</option>
            <option value="Expired">Expired</option>
            <option value="Inactive">Inactive</option>
          </select>

          <select className="sel" value={companyFilter} onChange={e=>setCompanyFilter(e.target.value)}>
            <option value="all">All Companies</option>
            {companies.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select>

          <div className="ct-space"/>
          <span style={{fontSize:12,color:'var(--wg2)'}}>{filtered.length} package{filtered.length!==1?'s':''}</span>
        </div>

        {filtered.length===0?(
          <div className="empty" style={{padding:'60px 20px'}}>No packages match the filters</div>
        ):(
          <table className="tbl">
            <thead>
              <tr>
                <th>Company</th>
                <th>Package</th>
                <th>Status</th>
                <th>Seats / Credits</th>
                <th>Billing</th>
                <th>Contract End</th>
                <th>Revenue</th>
                <th>Payments</th>
                <th>Latest Xero</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((p,i)=>{
                const rowKey=`${p.company.id}-${p.pkgId||p.planType}`;
                const statusCls=p.status==='Active'?'ps-active':p.status==='Scheduled'?'ps-scheduled':p.status==='Expired'?'ps-expired':p.status==='Overdue'?'ps-expired':p.status==='Pending'?'ps-inactive':'ps-archived';
                return (
                  <tr key={rowKey} style={{cursor:'pointer'}} onClick={()=>openCompany(p.company)}>
                    <td>
                      <span className="co-name">{p.company.name}</span>
                      <div style={{fontSize:11,color:'var(--wg2)'}}>ID #{p.company.id}</div>
                    </td>
                    <td>
                      <span className={p.planType==='CP'?'analytics-pill-cp':'analytics-pill-cc'}>{p.planType==='CP'?'Care Professional':'Care Certificate'}</span>
                      {p.planType==='CC'&&<div style={{fontSize:10,color:'var(--wg2)',marginTop:2}}>One-time purchase</div>}
                    </td>
                    <td><span className={statusCls}>{p.status}</span></td>
                    <td>
                      {p.planType==='CP'
                        ? <><span style={{fontWeight:600}}>{p.used}</span><span style={{color:'var(--wg2)',fontWeight:500}}>/{p.seats} seats</span></>
                        : <><span style={{fontWeight:600}}>{p.credits}</span><span style={{color:'var(--wg2)',fontWeight:500}}> credits</span></>
                      }
                    </td>
                    <td style={{fontSize:12,color:'var(--wg2)'}}>{p.planType==='CP'?p.billing||'—':'One-time'}</td>
                    <td style={{fontSize:12,color:'var(--wg2)'}}>{p.contractEnd?fmtDate(p.contractEnd):'—'}</td>
                    <td style={{fontWeight:700}}>{fmtGBP(p.revenue)}</td>
                    <td style={{textAlign:'center'}}>{p.paymentsCount}</td>
                    <td style={{fontFamily:'monospace',fontSize:11,color:'#1AB5A3',fontWeight:600}}>{p.latestXeroId||'—'}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

/* ── IMPORT PROGRESS MATRIX ── */
function ImportProgressMatrix({existingMembers=[],existingCertificates=[],onComplete,onCancel,mode='inline'}){
  const fmtDate=(d)=>{if(!d)return'—';return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});};
  const todayISO=new Date().toISOString().slice(0,10);
  const [stage,setStage]=useState('A'); // A=drop, B=preview, C=confirm
  const [fileName,setFileName]=useState('');
  const [rows,setRows]=useState([]);
  const [drag,setDrag]=useState(false);
  const [parseErr,setParseErr]=useState('');

  const memByEmail=React.useMemo(()=>{
    const m={};(existingMembers||[]).forEach(x=>{if(x.email)m[x.email.toLowerCase()]=x;});return m;
  },[existingMembers]);

  function handleFile(f){
    if(!f)return;
    if(f.size>5*1024*1024){setParseErr('File must be under 5MB');return;}
    if(!/\.(xlsx|csv)$/i.test(f.name)){setParseErr('Only .xlsx or .csv files accepted');return;}
    setParseErr('');setFileName(f.name);
    const isCSV=/\.csv$/i.test(f.name);
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        let json;
        if(isCSV){
          // Parse CSV manually to keep dates as raw strings (SheetJS auto-detects ambiguous DD/MM as US MM/DD)
          json=parseCSVText(ev.target.result);
        } else {
          const data=new Uint8Array(ev.target.result);
          const wb=XLSX.read(data,{type:'array',cellDates:false});
          const sheet=wb.Sheets[wb.SheetNames[0]];
          json=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:true});
        }
        const parsed=json.map((r,idx)=>buildRow(r,idx));
        setRows(parsed);
        setStage('B');
      }catch(err){setParseErr('Could not parse file: '+err.message);}
    };
    reader.onerror=()=>setParseErr('Could not read file');
    if(isCSV)reader.readAsText(f);
    else reader.readAsArrayBuffer(f);
  }

  function buildRow(r,idx){
    // Tolerant column matching
    const get=(keys)=>{for(const k of keys){const found=Object.keys(r).find(kk=>kk.toLowerCase().trim()===k.toLowerCase());if(found!==undefined&&r[found]!=='')return r[found];}return '';};
    const name=String(get(['Learner Name','Name','Full Name','Learner'])||'').trim();
    const email=String(get(['Learner Email','Email','Email Address'])||'').trim().toLowerCase();
    const courseRaw=String(get(['Course Name','Course','Module'])||'').trim();
    let status=String(get(['Status','Training Status','State'])||'').trim();
    const completion=parseImportDate(get(['Completion Date','Completed','Date Completed','Completion']));
    const expiry=parseImportDate(get(['Expiry Date','Expires','Expiry','Renewal Date']));
    const scoreRaw=get(['Score (%)','Score','Result']);
    const score=scoreRaw===''||scoreRaw==null?null:parseFloat(scoreRaw);

    // Normalise status (case-insensitive)
    if(status){
      const found=TRAINING_STATUSES.find(s=>s.toLowerCase()===status.toLowerCase());
      status=found||status; // keep raw if unknown — flagged below
    } else status='Not Started';

    const course=findCourseByName(courseRaw);
    const errors=[];
    if(!name)errors.push('Missing name');
    if(!email)errors.push('Missing email');
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))errors.push('Invalid email');
    if(!courseRaw)errors.push('Missing course');
    if(!TRAINING_STATUSES.includes(status))errors.push('Invalid status');
    if(score!==null&&(isNaN(score)||score<0||score>100))errors.push('Score out of range');
    if(CERT_ISSUING_STATUSES.includes(status)&&!completion)errors.push('Completion date required');

    return {idx,name,email,courseRaw,courseId:course?course.id:null,status,completion,expiry,score,skip:errors.length>0||!course,errors,manualMap:false};
  }

  function updateRow(idx,patch){setRows(rs=>rs.map(r=>r.idx===idx?{...r,...patch}:r));}
  function mapRowToCourse(idx,courseId){const c=COURSES.find(x=>x.id===courseId);updateRow(idx,{courseId,manualMap:true,skip:false,errors:rows.find(r=>r.idx===idx).errors.filter(e=>e!=='Invalid status')});}

  // Compute per-row "will-issue" + cert status for display
  function rowDecision(r){
    if(r.skip||r.errors.length>0||!r.courseId)return {issue:false};
    if(!CERT_ISSUING_STATUSES.includes(r.status))return {issue:false};
    const course=COURSES.find(c=>c.id===r.courseId);
    const exp=r.expiry||calcExpiry(r.completion,course);
    const isExpired=r.status==='Expired'||(exp&&exp<todayISO);
    return {issue:true,certStatus:isExpired?'Expired':'Active',expiryDate:exp,courseName:course?course.name:r.courseRaw};
  }

  // Live summary
  const summary=React.useMemo(()=>{
    let valid=0,invalid=0,unknown=0,certsActive=0,certsExpired=0,newLearners=new Set();
    rows.forEach(r=>{
      if(r.errors.length>0){invalid++;return;}
      if(!r.courseId){unknown++;return;}
      if(r.skip)return;
      valid++;
      if(!memByEmail[r.email])newLearners.add(r.email);
      const d=rowDecision(r);
      if(d.issue){if(d.certStatus==='Active')certsActive++;else certsExpired++;}
    });
    return {valid,invalid,unknown,newLearners:newLearners.size,certsActive,certsExpired,certsTotal:certsActive+certsExpired,total:rows.length};
  },[rows,memByEmail]);

  function commitImport(){
    const updMembers=[...(existingMembers||[])];
    const newCerts=[];
    const memIndex={}; // email -> member
    updMembers.forEach(m=>{if(m.email)memIndex[m.email.toLowerCase()]=m;});

    const importedAt=new Date().toISOString();
    let learnersCreated=0;
    const replacedCertIds=new Set();

    rows.forEach(r=>{
      if(r.errors.length>0||!r.courseId||r.skip)return;
      const course=COURSES.find(c=>c.id===r.courseId);
      let mem=memIndex[r.email];
      if(!mem){
        mem={id:Date.now()+Math.random(),name:r.name,email:r.email,role:'Learner',trainings:[]};
        updMembers.push(mem);memIndex[r.email]=mem;learnersCreated++;
      }
      if(!mem.trainings)mem.trainings=[];
      // Dedup: replace any existing training for same course; collect old certIds for removal
      mem.trainings=mem.trainings.filter(t=>{if(t.courseId===course.id){if(t.certId)replacedCertIds.add(t.certId);return false;}return true;});
      const dec=rowDecision(r);
      let certId=null;
      if(dec.issue){
        certId='cert-'+Date.now()+'-'+Math.floor(Math.random()*9999);
        newCerts.push({
          id:certId,certNumber:genCertNumber(),
          learnerEmail:r.email,learnerName:r.name,
          courseId:course.id,courseName:course.name,
          issueDate:r.completion,expiryDate:dec.expiryDate,
          status:dec.certStatus,source:'imported',importedAt,
        });
      }
      mem.trainings.push({
        id:'tr-'+Date.now()+'-'+Math.floor(Math.random()*9999),
        courseId:course.id,courseName:course.name,
        status:r.status,completionDate:r.completion,expiryDate:dec.expiryDate||r.expiry||null,
        score:r.score,certId,source:'imported',importedAt,
      });
    });

    const keptCerts=(existingCertificates||[]).filter(c=>!replacedCertIds.has(c.id));
    onComplete&&onComplete({
      members:updMembers,
      certificates:[...keptCerts,...newCerts],
      summary:{imported:summary.valid,learnersCreated,certsIssued:summary.certsTotal,certsActive:summary.certsActive,certsExpired:summary.certsExpired,certsReplaced:replacedCertIds.size,skipped:summary.invalid+summary.unknown+rows.filter(r=>r.skip&&r.errors.length===0&&r.courseId).length},
    });
  }

  /* ── RENDER ── */
  const Wrap=({children})=>mode==='modal'?(
    <div className="overlay" onClick={onCancel}>
      <div className="modal modal-lg" style={{maxWidth:920,maxHeight:'92vh',display:'flex',flexDirection:'column'}} onClick={e=>e.stopPropagation()}>
        <div className="mh"><span className="mh-title">Import Progress Matrix</span><button className="mclose" onClick={onCancel}><I n="x" s={16}/></button></div>
        <div style={{padding:'16px 24px',flex:1,overflowY:'auto'}}>{children}</div>
      </div>
    </div>
  ):<div>{children}</div>;

  if(stage==='A'){
    return(<Wrap>
      <div style={{background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:8,padding:'10px 14px',marginBottom:16,fontSize:12,display:'flex',gap:8,alignItems:'flex-start'}}>
        <I n="warn" s={13} style={{color:'#D97706',marginTop:1,flexShrink:0}}/>
        <span>Upload a learner-by-course progress matrix from your previous training provider. Completed and expired records will auto-issue certificates so renewal reminders pick up where you left off.</span>
      </div>
      <div onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0]);}} onClick={()=>document.getElementById('_pmInp').click()} style={{border:`2px dashed ${drag?'var(--coral)':'#CBD5E1'}`,borderRadius:12,padding:'40px 24px',textAlign:'center',cursor:'pointer',background:drag?'#FFF5F2':'white',transition:'all .2s'}}>
        <I n="upload" s={36} style={{color:'var(--wg2)'}}/>
        <p style={{marginTop:10,fontWeight:700,color:'var(--espresso)',fontSize:14}}>Drag &amp; drop file here</p>
        <p style={{fontSize:12,color:'var(--wg2)',marginTop:4}}>or click to browse</p>
        <p style={{fontSize:11,color:'var(--wg2)',marginTop:8}}>.xlsx or .csv · Max 5MB</p>
      </div>
      <input id="_pmInp" type="file" accept=".xlsx,.csv" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
      {parseErr&&<div style={{marginTop:12,padding:'10px 14px',background:'#FEF2F2',border:'1px solid #FECACA',borderRadius:8,fontSize:12,color:'#DC2626'}}>{parseErr}</div>}
      <div style={{marginTop:14,display:'flex',gap:10,alignItems:'center',justifyContent:'space-between',flexWrap:'wrap'}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>downloadCSV('ecert-progress-matrix-template.csv',buildImportTemplate())}><I n="dl" s={12}/> Download Template (.csv)</button>
        <span style={{fontSize:11,color:'var(--wg2)'}}>Required columns: Learner Name, Email, Course, Status. Optional: Completion Date, Expiry Date, Score (%).</span>
      </div>
      {mode==='modal'&&<div style={{marginTop:20,display:'flex',justifyContent:'flex-end'}}><button className="btn btn-ghost" onClick={onCancel}>Cancel</button></div>}
    </Wrap>);
  }

  if(stage==='B'){
    return(<Wrap>
      <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:14,fontSize:12}}>
        <I n="check" s={14} style={{color:'#16A34A'}}/>
        <span style={{fontWeight:600,color:'var(--espresso)'}}>{fileName}</span>
        <span style={{color:'var(--wg2)'}}>· {summary.total} rows parsed</span>
        <button className="btn btn-ghost btn-sm" style={{marginLeft:'auto'}} onClick={()=>{setStage('A');setRows([]);setFileName('');}}>Replace File</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:10,marginBottom:16}}>
        {[
          ['Valid',summary.valid,'#16A34A','#F0FDF4'],
          ['New Learners',summary.newLearners,'#1E40AF','#DBEAFE'],
          ['Certs to Issue',summary.certsTotal,'#B94A2A','#FFF5F2'],
          ['Unknown Course',summary.unknown,'#D97706','#FFFBEB'],
          ['Invalid',summary.invalid,'#DC2626','#FEF2F2'],
        ].map(([lbl,n,col,bg])=>(
          <div key={lbl} style={{background:bg,borderRadius:10,padding:'10px 12px',textAlign:'center'}}>
            <div style={{fontSize:22,fontWeight:700,color:col}}>{n}</div>
            <div style={{fontSize:10,color:'var(--wg2)',fontWeight:600,textTransform:'uppercase',letterSpacing:.4,marginTop:2}}>{lbl}</div>
          </div>
        ))}
      </div>
      {summary.certsTotal>0&&<div style={{background:'#F0FDF9',border:'1px solid #A7F3D0',borderRadius:8,padding:'10px 14px',marginBottom:16,fontSize:12,color:'#065F46',fontWeight:600,display:'flex',gap:8,alignItems:'center'}}><I n="inv" s={14}/> {summary.certsActive} active + {summary.certsExpired} expired certificate{summary.certsTotal===1?'':'s'} will be auto-issued on import.</div>}
      <div style={{border:'1px solid #E5E7EB',borderRadius:10,overflow:'hidden',maxHeight:400,overflowY:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
          <thead style={{background:'var(--peach)',position:'sticky',top:0,zIndex:1}}>
            <tr>
              {['','Learner','Course','Status','Completion','Cert','Action'].map(h=><th key={h} style={{padding:'8px 10px',textAlign:'left',fontWeight:700,color:'var(--espresso)',fontSize:11,textTransform:'uppercase',letterSpacing:.3}}>{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {rows.map(r=>{
              const dec=rowDecision(r);
              const isNew=r.email&&!memByEmail[r.email];
              const hasErr=r.errors.length>0;
              const unknown=!r.courseId&&!hasErr;
              const icon=hasErr?'✗':unknown?'⚠':isNew?'+':'✓';
              const iconCol=hasErr?'#DC2626':unknown?'#D97706':isNew?'#1E40AF':'#16A34A';
              return(
                <tr key={r.idx} style={{borderTop:'1px solid #F1F5F9',opacity:r.skip&&!hasErr&&!unknown?.5:1}}>
                  <td style={{padding:'8px 10px',fontWeight:700,color:iconCol,fontSize:14}}>{icon}</td>
                  <td style={{padding:'8px 10px'}}>
                    <div style={{fontWeight:600,color:'var(--espresso)'}}>{r.name||<span style={{color:'#DC2626'}}>(missing)</span>}{isNew&&!hasErr&&<span style={{marginLeft:6,fontSize:9,padding:'1px 6px',background:'#DBEAFE',color:'#1E40AF',borderRadius:10,fontWeight:700}}>NEW</span>}</div>
                    <div style={{fontSize:10,color:'var(--wg2)'}}>{r.email||'—'}</div>
                  </td>
                  <td style={{padding:'8px 10px'}}>
                    {r.courseId?(
                      <span style={{fontWeight:600,color:r.manualMap?'#1E40AF':'var(--espresso)'}}>{COURSES.find(c=>c.id===r.courseId).name}{r.manualMap&&<span style={{fontSize:9,marginLeft:4}}>(mapped)</span>}</span>
                    ):(
                      <select className="fsel" style={{margin:0,fontSize:11,padding:'4px 6px',height:'auto'}} value="" onChange={e=>e.target.value&&mapRowToCourse(r.idx,e.target.value)}>
                        <option value="">"{r.courseRaw||'?'}" — Map to…</option>
                        {COURSES.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                      </select>
                    )}
                  </td>
                  <td style={{padding:'8px 10px'}}>
                    <span className={`badge b-${(r.status==='Complete'?'active':r.status==='Expired'?'churned':r.status==='Failed'?'overdue':r.status==='In Progress'?'pending':'freeze')}`} style={{fontSize:10}}>{r.status}</span>
                  </td>
                  <td style={{padding:'8px 10px',fontSize:11,color:'var(--wg2)'}}>{fmtDate(r.completion)}</td>
                  <td style={{padding:'8px 10px',fontSize:11}}>
                    {dec.issue?(<span style={{color:dec.certStatus==='Active'?'#16A34A':'#DC2626',fontWeight:600}}>🎓 {dec.certStatus} → {fmtDate(dec.expiryDate)}</span>):(<span style={{color:'var(--wg2)'}}>—</span>)}
                  </td>
                  <td style={{padding:'8px 10px'}}>
                    {hasErr?<span title={r.errors.join(', ')} style={{fontSize:10,color:'#DC2626'}}>{r.errors[0]}</span>:(
                      <label style={{display:'flex',alignItems:'center',gap:4,fontSize:11,cursor:'pointer'}}>
                        <input type="checkbox" checked={!r.skip} onChange={e=>updateRow(r.idx,{skip:!e.target.checked})}/> Include
                      </label>
                    )}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div style={{marginTop:16,display:'flex',gap:10,alignItems:'center'}}>
        <button className="btn btn-ghost" onClick={()=>{setStage('A');setRows([]);}}><I n="cl" s={13}/> Back</button>
        <div style={{flex:1}}/>
        {mode==='modal'&&<button className="btn btn-ghost" onClick={onCancel}>Cancel</button>}
        <button className="btn btn-coral" disabled={summary.valid===0} onClick={()=>setStage('C')}>Continue → Review</button>
      </div>
    </Wrap>);
  }

  // Stage C — Confirm
  return(<Wrap>
    <div style={{background:'#F0FDF4',border:'1px solid #BBF7D0',borderRadius:10,padding:'16px 20px',marginBottom:16}}>
      <div style={{fontSize:14,fontWeight:700,color:'#065F46',marginBottom:8,display:'flex',gap:8,alignItems:'center'}}><I n="check" s={16}/> Ready to Import</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginTop:10}}>
        <div><div style={{fontSize:22,fontWeight:700,color:'var(--espresso)'}}>{summary.valid}</div><div style={{fontSize:10,color:'var(--wg2)',fontWeight:600,textTransform:'uppercase'}}>Records</div></div>
        <div><div style={{fontSize:22,fontWeight:700,color:'#1E40AF'}}>{summary.newLearners}</div><div style={{fontSize:10,color:'var(--wg2)',fontWeight:600,textTransform:'uppercase'}}>New Learners</div></div>
        <div><div style={{fontSize:22,fontWeight:700,color:'#16A34A'}}>{summary.certsActive}</div><div style={{fontSize:10,color:'var(--wg2)',fontWeight:600,textTransform:'uppercase'}}>Active Certs</div></div>
        <div><div style={{fontSize:22,fontWeight:700,color:'#DC2626'}}>{summary.certsExpired}</div><div style={{fontSize:10,color:'var(--wg2)',fontWeight:600,textTransform:'uppercase'}}>Expired Certs</div></div>
      </div>
    </div>
    {summary.certsExpired>0&&<div style={{background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:8,padding:'10px 14px',marginBottom:16,fontSize:12,color:'#92400E',display:'flex',gap:8}}><I n="warn" s={14} style={{flexShrink:0,marginTop:1}}/><span><strong>{summary.certsExpired} expired certificate{summary.certsExpired===1?'':'s'}</strong> will be created so renewal reminders fire immediately. Learners will see these in their dashboard.</span></div>}
    <div style={{fontSize:12,color:'var(--wg2)',marginBottom:16}}>Auto-create {summary.newLearners} learner account{summary.newLearners===1?'':'s'} · Issue {summary.certsTotal} certificate{summary.certsTotal===1?'':'s'} · Skip {summary.invalid+summary.unknown} invalid row{(summary.invalid+summary.unknown)===1?'':'s'}.</div>
    <div style={{display:'flex',gap:10,alignItems:'center'}}>
      <button className="btn btn-ghost" onClick={()=>setStage('B')}><I n="cl" s={13}/> Back to Preview</button>
      <div style={{flex:1}}/>
      {mode==='modal'&&<button className="btn btn-ghost" onClick={onCancel}>Cancel</button>}
      <button className="btn btn-coral" onClick={commitImport}><I n="check" s={13}/> Import &amp; Issue Certificates</button>
    </div>
  </Wrap>);
}

/* ── ADD COMPANY MODAL ── */
function AddCompanyModal({onSave,onClose}){
  const todayISO=()=>new Date().toISOString().slice(0,10);
  const addDays=(d,n)=>{const dt=new Date(d);dt.setDate(dt.getDate()+n);return dt.toISOString().slice(0,10);};
  const addMonths=(d,n)=>{const dt=new Date(d);dt.setMonth(dt.getMonth()+n);return dt.toISOString().slice(0,10);};
  const addYears=(d,n)=>{const dt=new Date(d);dt.setFullYear(dt.getFullYear()+n);return dt.toISOString().slice(0,10);};
  const fmtDate=(d)=>{if(!d)return'—';return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});};
  const fmtMoney=(n)=>'£'+n.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
  const genInv=()=>'INV-'+(Math.floor(1000+Math.random()*8999));
  const t0=todayISO();
  const [step,setStep]=useState(1);
  const [form,setForm]=useState({name:'',logo:null,address:'',orgType:'',contactNumber:'',companyNumber:'',cqcId:'',leadSource:'',status:'Free Trial',allowCerts:true,allowReminders:true,planMode:'trial',planType:'CP',billingCycle:'Annual',qty:'',contractStart:t0,contractEnd:addYears(t0,1),discountAmount:'',discountReason:'',recurringInvoice:false,recurringStartDate:t0,members:[],importFile:null,certificates:[],importSummary:null});
  const [errors,setErrors]=useState([]);
  const [drag,setDrag]=useState(false);
  const mbRef=useRef(null);
  const upd=p=>setForm(f=>({...f,...p}));
  const unitPrice=form.planType==='CP'?(form.billingCycle==='Annual'?35:3.5):15;
  const qty=parseInt(form.qty)||0;
  const subtotal=qty*unitPrice;
  const disc=parseFloat(form.discountAmount)||0;
  const net=Math.max(0,subtotal-disc);
  const vat=net*0.20;
  const total=net+vat;
  const validate=s=>{const e=[];if(s===1){if(!form.name.trim())e.push('Company Name');if(!form.address.trim())e.push('Address');if(!form.orgType)e.push('Organisation Type');if(!form.contactNumber.trim())e.push('Contact Number');}if(s===2&&form.planMode==='paid'){if(qty<1)e.push('Quantity (≥ 1)');if(form.billingCycle==='Monthly'&&form.recurringInvoice&&!form.recurringStartDate)e.push('Recurring Start Date');}if(s===3)form.members.forEach((m,i)=>{if(!m.name.trim())e.push(`Member ${i+1} Name`);if(!m.email.trim())e.push(`Member ${i+1} Email`);else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m.email))e.push(`Member ${i+1} invalid email`);});return e;};
  const goNext=()=>{const e=validate(step);if(e.length){setErrors(e);if(mbRef.current)mbRef.current.scrollTop=0;return;}setErrors([]);setStep(s=>s+1);};
  const goTo=n=>{if(n<step){setErrors([]);setStep(n);}};
  const addMember=()=>upd({members:[...form.members,{id:Date.now(),name:'',email:'',role:form.members.length===0?'Manager':'Coordinator'}]});
  const removeMember=id=>{let ms=form.members.filter(m=>m.id!==id);if(ms.length)ms=[{...ms[0],role:'Manager'},...ms.slice(1)];upd({members:ms});};
  const updMember=(id,p)=>upd({members:form.members.map(m=>m.id===id?{...m,...p}:m)});

  const SLBLS=['Details','Package & Payment','Members','Import','Review'];
  const pendingErrs=validate(step);
  return(
    <div className="overlay" onClick={onClose}>

          <span className="mh-title">Add Company</span>
          <button className="mclose" onClick={onClose}><I n="x" s={16}/></button>
        </div>
        <div className="stepper" style={{padding:'16px 24px 0',flexShrink:0}}>

              <div className={`step${step>=i+1?' on':''}${step>i+1?' done':''}`} onClick={()=>goTo(i+1)} style={{cursor:step>i+1?'pointer':'default'}}>
                <div className="step-circ">{step>i+1?'✓':i+1}</div>
                <span className="step-lbl">{lbl}</span>
              </div>
            </React.Fragment>
          ))}
        </div>
        {errors.length>0&&<div style={{margin:'12px 24px 0',padding:'10px 14px',background:'#FEF2F2',border:'1px solid #FECACA',borderRadius:8,display:'flex',gap:8,alignItems:'flex-start',flexShrink:0}}><I n="warn" s={14} style={{color:'var(--red)',marginTop:1,flexShrink:0}}/><div style={{fontSize:12,color:'#DC2626'}}><strong>Please fill in:</strong> {errors.join(', ')}</div></div>}
        <div className="mbody" ref={mbRef} style={{flex:1,overflowY:'auto'}}>

          {step===1&&(
            <div className="fg">
              <div className="fgrp full"><label className="flbl req">Company Name</label><input className="finp" type="text" placeholder="Company name" maxLength={200} value={form.name} onChange={e=>upd({name:e.target.value})}/></div>
              <div className="fgrp full"><label className="flbl">Logo</label>
                <div className="file-up" style={{cursor:'pointer'}} onClick={()=>document.getElementById('_logoInp').click()}>
                  <I n="upload" s={28}/>
                  {form.logo?<p style={{marginTop:8,fontSize:13,fontWeight:600,color:'var(--coral)'}}>{form.logo.name}</p>:<><p style={{marginTop:8,fontSize:13,fontWeight:600}}>Click to upload logo</p><p style={{fontSize:11,color:'var(--wg2)'}}>JPG, PNG · Max 10MB · Square crop applied</p></>}
                </div>
                <input id="_logoInp" type="file" accept="image/jpeg,image/png" style={{display:'none'}} onChange={e=>{const f=e.target.files[0];if(f){if(f.size>10*1024*1024){alert('Logo must be under 10MB');return;}upd({logo:f});}}}/>
              </div>
              <div className="fgrp full"><label className="flbl req">Address</label><textarea className="fta" rows={3} placeholder="Full registered address" value={form.address} onChange={e=>upd({address:e.target.value})}/></div>
              <div className="fgrp"><label className="flbl req">Organisation Type</label>
                <select className="fsel" value={form.orgType} onChange={e=>upd({orgType:e.target.value})}>

                </select>
              </div>
              <div className="fgrp"><label className="flbl req">Contact Number</label><input className="finp" type="tel" placeholder="UK phone number" value={form.contactNumber} onChange={e=>upd({contactNumber:e.target.value})}/></div>
              <div className="fgrp"><label className="flbl">Companies House No.</label><input className="finp" type="text" placeholder="e.g. 12345678" value={form.companyNumber} onChange={e=>upd({companyNumber:e.target.value})}/></div>
              <div className="fgrp"><label className="flbl">CQC Registration ID</label><input className="finp" type="text" placeholder="e.g. 1-123456789" value={form.cqcId} onChange={e=>upd({cqcId:e.target.value})}/></div>
              <div className="fgrp"><label className="flbl">Lead Source</label>
                <select className="fsel" value={form.leadSource} onChange={e=>upd({leadSource:e.target.value})}>
                  <option value="">Select…</option>
                  {['CQC Register','Referral','Direct Enquiry','Marketing Campaign','Trade Show / Event','Other'].map(o=><option key={o}>{o}</option>)}
                </select>
              </div>
              <div className="fgrp"><label className="flbl">Status</label>
                <select className="fsel" value={form.status} onChange={e=>upd({status:e.target.value})}>
                  {['Free Trial','Active','Freeze','Churned'].map(o=><option key={o}>{o}</option>)}
                </select>
              </div>
              <div className="fgrp full">
                <div className="toggle-row"><span className="trow-lbl">Allow Certificates — learners can view &amp; download certificates</span><label className="toggle-sw"><input type="checkbox" checked={form.allowCerts} onChange={e=>upd({allowCerts:e.target.checked})}/><span className="tslider"/></label></div>
                <div className="toggle-row" style={{marginTop:10}}><span className="trow-lbl">Allow Reminder Emails — system sends expiry/renewal reminders</span><label className="toggle-sw"><input type="checkbox" checked={form.allowReminders} onChange={e=>upd({allowReminders:e.target.checked})}/><span className="tslider"/></label></div>
              </div>
            </div>
          )}

          {/* STEP 2: PACKAGE & PAYMENT */}
          {step===2&&(
            <div style={{padding:'0 2px'}}>
              <div style={{display:'flex',gap:0,background:'var(--peach)',borderRadius:10,padding:4,marginBottom:24}}>

                ))}
              </div>
              {form.planMode==='trial'&&(
                <div style={{background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:12,padding:24,textAlign:'center'}}>
                  <div style={{fontSize:16,fontWeight:700,color:'var(--espresso)',marginBottom:14}}>Free Trial — 14 Days</div>
                  <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap',marginBottom:14}}>
                    {['5 CP Seats','5 CC Credits','14-Day Trial','No Invoice'].map(c=><span key={c} style={{background:'white',border:'1px solid #FDE68A',borderRadius:20,padding:'5px 14px',fontSize:13,fontWeight:600,color:'#92400E'}}>{c}</span>)}
                  </div>
                  <p style={{fontSize:12,color:'var(--wg2)'}}>No invoice will be generated. Trial expires 14 days after account creation.</p>
                </div>
              )}
              {form.planMode==='paid'&&(<>
                <div style={{marginBottom:20}}>
                  <label className="flbl">Plan Type</label>
