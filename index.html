                    {[['CP','Care Professional','Reassignable seats · subscription'],['CC','Care Certificate','One-time credits · no expiry']].map(([v,l,d])=>(
                      <button key={v} onClick={()=>{if(v==='CC')upd({planType:'CC',billingCycle:'One-time',recurringInvoice:false});else upd({planType:'CP',billingCycle:'Annual',contractEnd:addYears(form.contractStart,1)});}} style={{flex:1,padding:'12px 14px',border:`2px solid ${form.planType===v?'var(--coral)':'#E5E7EB'}`,borderRadius:10,background:form.planType===v?'#FFF5F2':'white',cursor:'pointer',textAlign:'left',fontFamily:'Montserrat,sans-serif',transition:'all .15s'}}>
                        <div style={{fontWeight:700,fontSize:14,color:form.planType===v?'var(--coral)':'var(--espresso)'}}>{l}</div>
                        <div style={{fontSize:11,color:'var(--wg2)',marginTop:3}}>{d}</div>
                      </button>
                    ))}
                  </div>
                </div>
                {form.planType==='CP'&&(
                  <div style={{marginBottom:20}}>
                    <label className="flbl">Billing Cycle</label>
                    <div style={{display:'flex',gap:0,background:'var(--peach)',borderRadius:8,padding:3,marginTop:6,width:'fit-content'}}>
                      {['Annual','Monthly'].map(v=>(
                        <button key={v} onClick={()=>{const ce=v==='Annual'?addYears(form.contractStart,1):addMonths(form.contractStart,1);upd({billingCycle:v,contractEnd:ce,...(v==='Annual'?{recurringInvoice:false}:{})});}} style={{padding:'7px 18px',border:'none',borderRadius:6,fontWeight:600,fontSize:13,cursor:'pointer',background:form.billingCycle===v?'white':'transparent',color:form.billingCycle===v?'var(--espresso)':'var(--wg2)',boxShadow:form.billingCycle===v?'0 1px 3px rgba(0,0,0,.1)':'none',fontFamily:'Montserrat,sans-serif',transition:'all .15s'}}>{v}</button>
                      ))}
                    </div>
                    <div style={{fontSize:11,color:'var(--wg2)',marginTop:5}}>{form.billingCycle==='Annual'?'£35 per seat / year':'£3.50 per seat / month'}</div>
                  </div>
                )}
                <div style={{marginBottom:20}}>
                  <label className="flbl req">{form.planType==='CP'?'Number of Seats':'Number of Credits'}</label>
                  <input className="finp" type="number" min={1} step={1} style={{maxWidth:160,marginTop:6}} placeholder="0" value={form.qty} onChange={e=>upd({qty:e.target.value})}/>
                  <div style={{fontSize:11,color:'var(--wg2)',marginTop:4}}>Unit price: {form.planType==='CP'?(form.billingCycle==='Annual'?'£35 / seat / year':'£3.50 / seat / month'):'£15 / credit'}</div>
                </div>
                {form.planType==='CP'&&(
                  <div style={{marginBottom:20}}>
                    <label className="flbl">Contract Period</label>
                    <div style={{display:'flex',gap:12,marginTop:6,flexWrap:'wrap'}}>
                      <div style={{flex:1,minWidth:140}}>
                        <div style={{fontSize:11,color:'var(--wg2)',marginBottom:4}}>Start Date</div>
                        <input className="finp" type="date" value={form.contractStart} onChange={e=>{const cs=e.target.value;const ce=form.billingCycle==='Annual'?addYears(cs,1):addMonths(cs,1);upd({contractStart:cs,contractEnd:ce});}}/>
                      </div>
                      <div style={{flex:1,minWidth:140}}>
                        <div style={{fontSize:11,color:'var(--wg2)',marginBottom:4}}>End Date (auto-calculated, editable)</div>
                        <input className="finp" type="date" value={form.contractEnd} onChange={e=>upd({contractEnd:e.target.value})}/>
                      </div>
                    </div>
                    {form.contractStart&&form.contractEnd&&<div style={{marginTop:10,padding:'8px 12px',background:'var(--peach)',borderRadius:8,fontSize:12,color:'var(--espresso)',fontWeight:600,display:'flex',alignItems:'center',gap:8}}><I n="cal" s={13}/>{fmtDate(form.contractStart)} → {fmtDate(form.contractEnd)}</div>}
                  </div>
                )}
                <div style={{marginBottom:20,padding:'16px',background:'var(--peach)',borderRadius:10}}>
                  <label className="flbl" style={{marginBottom:10,display:'block'}}>Discount (Optional)</label>
                  <div style={{display:'flex',gap:12}}>
                    <div style={{flex:'0 0 160px'}}>
                      <div style={{fontSize:11,color:'var(--wg2)',marginBottom:4}}>Discount Amount (£)</div>
                      <input className="finp" type="number" min={0} step={0.01} placeholder="0.00" style={{background:'white'}} value={form.discountAmount} onChange={e=>upd({discountAmount:e.target.value})}/>
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:11,color:'var(--wg2)',marginBottom:4}}>Reason</div>
                      <input className="finp" type="text" placeholder="e.g. Renewal discount" style={{background:'white'}} value={form.discountReason} onChange={e=>upd({discountReason:e.target.value})}/>
                    </div>
                  </div>
                </div>
                {form.planType==='CP'&&form.billingCycle==='Monthly'&&(
                  <div style={{marginBottom:20,padding:'16px',background:'#F0FDF4',border:'1px solid #BBF7D0',borderRadius:10}}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                      <div><div style={{fontWeight:700,fontSize:13,color:'var(--espresso)'}}>Set up Recurring Invoice</div><div style={{fontSize:11,color:'var(--wg2)',marginTop:2}}>Xero auto-generates monthly invoices from this date</div></div>
                      <label className="toggle-sw"><input type="checkbox" checked={form.recurringInvoice} onChange={e=>upd({recurringInvoice:e.target.checked})}/><span className="tslider"/></label>
                    </div>
                    {form.recurringInvoice&&<div style={{marginTop:12}}><div style={{fontSize:11,color:'var(--wg2)',marginBottom:4}}>Recurring Start Date</div><input className="finp" type="date" style={{maxWidth:180,background:'white'}} value={form.recurringStartDate} onChange={e=>upd({recurringStartDate:e.target.value})}/></div>}
                  </div>
                )}
                {qty>0&&(
                  <div style={{border:'1px solid #E5E7EB',borderRadius:12,overflow:'hidden'}}>
                    <div style={{padding:'12px 16px',background:'var(--espresso)',color:'white'}}>
                      <div style={{fontWeight:700,fontSize:13}}>{form.recurringInvoice&&form.billingCycle==='Monthly'?'Monthly Recurring Invoice':'Invoice Preview'}</div>
                      <div style={{fontSize:10,opacity:.7,marginTop:2}}>Auto-generated in Xero on save</div>
                    </div>
                    <div style={{padding:'16px'}}>
                      <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:8}}><span style={{color:'var(--wg2)'}}>{form.planType==='CP'?'Care Professional':'Care Certificate'} ({form.billingCycle}): {qty} × {fmtMoney(unitPrice)}</span><span style={{fontWeight:600}}>{fmtMoney(subtotal)}</span></div>
                      {disc>0&&<><div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:8,color:'#16A34A'}}><span>Discount{form.discountReason?` (${form.discountReason})`:''}</span><span>−{fmtMoney(disc)}</span></div><div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:8}}><span style={{color:'var(--wg2)'}}>Net</span><span style={{fontWeight:600}}>{fmtMoney(net)}</span></div></>}
                      <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:8,color:'var(--wg2)'}}><span>VAT (20%)</span><span>{fmtMoney(vat)}</span></div>
                      <div style={{display:'flex',justifyContent:'space-between',fontSize:15,fontWeight:700,color:'var(--coral)',borderTop:'1px solid #E5E7EB',paddingTop:10,marginTop:4}}><span>{form.recurringInvoice&&form.billingCycle==='Monthly'?'Total / month':'Total'}</span><span>{fmtMoney(total)}</span></div>
                      <div style={{marginTop:10,fontSize:11,color:'var(--wg2)'}}>{form.recurringInvoice&&form.billingCycle==='Monthly'?`First invoice due ${fmtDate(form.recurringStartDate)}. Monthly invoices auto-generated thereafter.`:`Payment due: ${fmtDate(addDays(t0,30))} (30 days from today)`}</div>
                      <div style={{marginTop:10,display:'flex',alignItems:'center',gap:6,padding:'6px 10px',background:'#F0FDF9',borderRadius:6,fontSize:11,fontWeight:600,color:'#1AB5A3'}}><I n="inv" s={12}/> Invoice will be auto-created in Xero on save</div>
                    </div>
                  </div>
                )}
              </>)}
            </div>
          )}

          {/* STEP 3: MEMBERS */}
          {step===3&&(
            <div>
              {form.members.length===0?(
                <div className="empty" style={{padding:'40px 0'}}>
                  <I n="users" s={40}/>
                  <p style={{marginTop:12,fontWeight:700,color:'var(--espresso)',fontSize:16}}>Add the Manager First</p>
                  <p style={{marginTop:6,fontSize:13}}>The first member added is automatically locked as Manager</p>
                  <button className="btn btn-coral" style={{marginTop:16}} onClick={addMember}><I n="plus" s={13}/> Add Member</button>
                </div>
              ):(
                <>
                  <div style={{background:'#FFF5F2',border:'1px solid var(--coral)',borderRadius:8,padding:'10px 14px',marginBottom:16,fontSize:12,display:'flex',gap:8,alignItems:'center'}}>
                    <I n="warn" s={13} style={{color:'var(--coral)',flexShrink:0}}/>
                    <span>First member is set as <strong>Manager</strong> and will receive a setup email on account creation.</span>
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:10}}>
                    {form.members.map((m,i)=>(
                      <div key={m.id} style={{display:'flex',gap:10,alignItems:'flex-start',padding:'12px',background:i===0?'#FFF5F2':'white',border:`1px solid ${i===0?'var(--coral)':'#E5E7EB'}`,borderRadius:10}}>
                        <div style={{display:'flex',flexDirection:'column',gap:8,flex:1}}>
                          <div style={{display:'flex',gap:8,alignItems:'center'}}>
                            {i===0&&<span style={{background:'var(--coral)',color:'white',borderRadius:20,padding:'2px 10px',fontSize:10,fontWeight:700,whiteSpace:'nowrap',flexShrink:0}}>Manager</span>}
                            <input className="finp" style={{margin:0,flex:1}} type="text" placeholder="Full name" value={m.name} onChange={e=>updMember(m.id,{name:e.target.value})}/>
                          </div>
                          <div style={{display:'flex',gap:8}}>
                            <input className="finp" style={{margin:0,flex:1}} type="email" placeholder="Email address" value={m.email} onChange={e=>updMember(m.id,{email:e.target.value})}/>
                            <select className="fsel" style={{margin:0,width:140,flexShrink:0}} value={m.role} disabled={i===0} onChange={e=>updMember(m.id,{role:e.target.value})}>
                              {i===0?<option>Manager</option>:['Coordinator','Assessor','Learner'].map(r=><option key={r}>{r}</option>)}
                            </select>
                          </div>
                        </div>
                        {i>0&&<button className="btn btn-ghost btn-sm" style={{color:'var(--red)',padding:'6px',marginTop:2,flexShrink:0}} onClick={()=>removeMember(m.id)}><I n="trash" s={13}/></button>}
                      </div>
                    ))}
                  </div>
                  <div style={{display:'flex',gap:10,marginTop:14}}>
                    <button className="btn btn-ghost btn-sm" onClick={addMember}><I n="plus" s={13}/> Add Member</button>
                    <button className="btn btn-ghost btn-sm" disabled title="Coming soon"><I n="upload" s={13}/> Bulk Upload</button>
                  </div>
                </>
              )}
            </div>
          )}

          {/* STEP 4: IMPORT PROGRESS MATRIX */}
          {step===4&&(
            <div>
              {form.importSummary?(
                <div>
                  <div style={{background:'#F0FDF4',border:'1px solid #BBF7D0',borderRadius:10,padding:'16px 20px',marginBottom:16}}>
                    <div style={{fontSize:14,fontWeight:700,color:'#065F46',marginBottom:8,display:'flex',gap:8,alignItems:'center'}}><I n="check" s={16}/> Progress Matrix Imported</div>
                    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginTop:10}}>
                      <div><div style={{fontSize:22,fontWeight:700,color:'var(--espresso)'}}>{form.importSummary.imported}</div><div style={{fontSize:10,color:'var(--wg2)',fontWeight:600,textTransform:'uppercase'}}>Records</div></div>
                      <div><div style={{fontSize:22,fontWeight:700,color:'#1E40AF'}}>{form.importSummary.learnersCreated}</div><div style={{fontSize:10,color:'var(--wg2)',fontWeight:600,textTransform:'uppercase'}}>New Learners</div></div>
                      <div><div style={{fontSize:22,fontWeight:700,color:'#16A34A'}}>{form.importSummary.certsActive}</div><div style={{fontSize:10,color:'var(--wg2)',fontWeight:600,textTransform:'uppercase'}}>Active Certs</div></div>
                      <div><div style={{fontSize:22,fontWeight:700,color:'#DC2626'}}>{form.importSummary.certsExpired}</div><div style={{fontSize:10,color:'var(--wg2)',fontWeight:600,textTransform:'uppercase'}}>Expired Certs</div></div>
                    </div>
                  </div>
                  <button className="btn btn-ghost btn-sm" onClick={()=>upd({importSummary:null,certificates:[]})}><I n="cl" s={12}/> Re-import (replace)</button>
                </div>
              ):(
                <ImportProgressMatrix
                  existingMembers={form.members}
                  existingCertificates={form.certificates}
                  onComplete={(res)=>upd({members:res.members,certificates:res.certificates,importSummary:res.summary})}
                />
              )}
            </div>
          )}

          {/* STEP 5: REVIEW */}
          {step===5&&(
            <div>
              <div style={{background:'#F0FDF4',border:'1px solid #BBF7D0',borderRadius:8,padding:'12px 16px',marginBottom:20,display:'flex',gap:8,alignItems:'center',fontSize:13,fontWeight:600,color:'#166534'}}>
                <I n="check" s={14}/> Everything looks good. Review the details below before creating the company.
              </div>
              <div style={{marginBottom:20}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                  <div style={{fontWeight:700,fontSize:13,color:'var(--espresso)'}}>Company Details</div>
                  <button className="btn btn-ghost btn-sm" onClick={()=>goTo(1)}><I n="edit" s={11}/> Edit</button>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px 20px',background:'var(--peach)',borderRadius:10,padding:16}}>
                  {[['Company Name',form.name],['Organisation Type',form.orgType||'—'],['Contact Number',form.contactNumber],['Companies House',form.companyNumber||'—'],['CQC ID',form.cqcId||'—'],['Lead Source',form.leadSource||'—'],['Status',form.status],['Allow Certs',form.allowCerts?'Yes':'No'],['Allow Reminders',form.allowReminders?'Yes':'No']].map(([k,v])=>(
                    <div key={k}><div style={{fontSize:10,color:'var(--wg2)',fontWeight:600,textTransform:'uppercase',letterSpacing:.5}}>{k}</div><div style={{fontSize:13,fontWeight:600,color:'var(--espresso)',marginTop:2}}>{v}</div></div>
                  ))}
                </div>
              </div>
              <div style={{marginBottom:20}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                  <div style={{fontWeight:700,fontSize:13,color:'var(--espresso)'}}>Package &amp; Payment</div>
                  <button className="btn btn-ghost btn-sm" onClick={()=>goTo(2)}><I n="edit" s={11}/> Edit</button>
                </div>
                {form.planMode==='trial'?(
                  <div style={{background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:10,padding:'12px 16px',fontSize:13,color:'#92400E',fontWeight:600}}>Free Trial — 5 CP seats + 5 CC credits · 14-day trial · No invoice generated</div>
                ):(
                  <div style={{background:'var(--peach)',borderRadius:10,padding:16}}>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px 20px'}}>
                      {[['Plan',form.planType==='CP'?'Care Professional':'Care Certificate'],['Billing',form.billingCycle],['Quantity',`${qty} ${form.planType==='CP'?'seats':'credits'}`],['Unit Price',fmtMoney(unitPrice)],...(form.planType==='CP'?[['Contract Start',fmtDate(form.contractStart)],['Contract End',fmtDate(form.contractEnd)]]:([])),...(form.planType==='CP'&&form.billingCycle==='Monthly'?[['Recurring Invoice',form.recurringInvoice?`✓ From ${fmtDate(form.recurringStartDate)}`:'✗ Not set up']]:[]),...(disc>0?[['Discount',`−${fmtMoney(disc)}${form.discountReason?` (${form.discountReason})`:''}`]]:[])].map(([k,v])=>(
                        <div key={k}><div style={{fontSize:10,color:'var(--wg2)',fontWeight:600,textTransform:'uppercase',letterSpacing:.5}}>{k}</div><div style={{fontSize:13,fontWeight:600,color:k==='Discount'?'#16A34A':k==='Recurring Invoice'?(form.recurringInvoice?'#16A34A':'var(--wg2)'):'var(--espresso)',marginTop:2}}>{v}</div></div>
                      ))}
                    </div>
                    <div style={{display:'flex',justifyContent:'space-between',marginTop:12,borderTop:'1px solid #E5E7EB',paddingTop:10,fontWeight:700}}><span style={{color:'var(--espresso)'}}>Total{form.recurringInvoice&&form.billingCycle==='Monthly'?' / month':''}</span><span style={{color:'var(--coral)',fontSize:16}}>{fmtMoney(total)}</span></div>
                  </div>
                )}
              </div>
              {form.members.length>0&&(
                <div style={{marginBottom:20}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                    <div style={{fontWeight:700,fontSize:13,color:'var(--espresso)'}}>Members ({form.members.length})</div>
                    <button className="btn btn-ghost btn-sm" onClick={()=>goTo(3)}><I n="edit" s={11}/> Edit</button>
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    {form.members.map((m,i)=>(
                      <div key={m.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',background:'var(--peach)',borderRadius:8}}>
                        <div style={{width:32,height:32,borderRadius:'50%',background:'var(--coral)',display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontWeight:700,fontSize:13,flexShrink:0}}>{m.name?m.name[0].toUpperCase():'?'}</div>
                        <div style={{flex:1}}><div style={{fontWeight:600,fontSize:13,color:'var(--espresso)',display:'flex',alignItems:'center',gap:6}}>{m.name||'(No name)'}{i===0&&<span style={{background:'var(--coral)',color:'white',borderRadius:20,padding:'1px 8px',fontSize:9,fontWeight:700}}>Manager</span>}</div><div style={{fontSize:11,color:'var(--wg2)',marginTop:2}}>{m.email||'(No email)'}</div></div>
                        <span className={`badge b-${m.role.toLowerCase()}`} style={{fontSize:11}}>{m.role}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {form.importSummary&&(
                <div style={{marginBottom:20}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                    <div style={{fontWeight:700,fontSize:13,color:'var(--espresso)'}}>Progress Matrix Import</div>
                    <button className="btn btn-ghost btn-sm" onClick={()=>goTo(4)}><I n="edit" s={11}/> Edit</button>
                  </div>
                  <div style={{background:'#F0FDF4',border:'1px solid #BBF7D0',borderRadius:10,padding:'12px 16px'}}>
                    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
                      <div><div style={{fontSize:18,fontWeight:700,color:'var(--espresso)'}}>{form.importSummary.imported}</div><div style={{fontSize:10,color:'var(--wg2)',fontWeight:600,textTransform:'uppercase'}}>Records</div></div>
                      <div><div style={{fontSize:18,fontWeight:700,color:'#1E40AF'}}>{form.importSummary.learnersCreated}</div><div style={{fontSize:10,color:'var(--wg2)',fontWeight:600,textTransform:'uppercase'}}>New Learners</div></div>
                      <div><div style={{fontSize:18,fontWeight:700,color:'#16A34A'}}>{form.importSummary.certsActive}</div><div style={{fontSize:10,color:'var(--wg2)',fontWeight:600,textTransform:'uppercase'}}>Active Certs</div></div>
                      <div><div style={{fontSize:18,fontWeight:700,color:'#DC2626'}}>{form.importSummary.certsExpired}</div><div style={{fontSize:10,color:'var(--wg2)',fontWeight:600,textTransform:'uppercase'}}>Expired Certs</div></div>
                    </div>
                  </div>
                </div>
              )}
              {form.planMode==='paid'&&(
                <div style={{display:'flex',alignItems:'center',gap:8,padding:'12px 16px',background:'#F0FDF9',border:'1px solid #A7F3D0',borderRadius:10,fontSize:12,fontWeight:600,color:'#1AB5A3'}}>
                  <I n="inv" s={16}/> Invoice will be auto-created in Xero and emailed to the Manager on account creation.
                </div>
              )}
            </div>
          )}

        </div>
        <div className="mfoot" style={{flexDirection:'column',gap:8}}>
          <div style={{width:'100%',textAlign:'center',fontSize:11,minHeight:16}}>
            {step<5&&(pendingErrs.length>0?<span style={{color:'var(--red)',fontWeight:600}}>Missing: {pendingErrs.slice(0,3).join(', ')}{pendingErrs.length>3?` +${pendingErrs.length-3} more`:''}</span>:<span style={{color:'#16A34A',fontWeight:600}}>✓ Ready to continue</span>)}
          </div>
          <div style={{display:'flex',width:'100%',alignItems:'center',gap:8}}>
            {step>1&&<button className="btn btn-ghost" onClick={()=>{setErrors([]);setStep(s=>s-1);}}><I n="cl" s={13}/> Back</button>}
            <div style={{flex:1}}/>
            <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
            {step===3&&<button className="btn btn-ghost" onClick={()=>{setErrors([]);setStep(4);}}>Skip Members</button>}
            {step===4&&<button className="btn btn-ghost" onClick={()=>{setErrors([]);setStep(5);}}>Skip Import</button>}
            {step<5&&<button className="btn btn-coral" onClick={goNext}>Next <I n="cr" s={13}/></button>}
            {step===5&&<button className="btn btn-coral" onClick={handleCreate}><I n="check" s={13}/> Create Company</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── EDIT COMPANY MODAL ── */
function EditCompanyModal({company,onSave,onClose}){
  const fmtDate=(d)=>{if(!d)return'—';return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});};
  const fmtMoney=(n)=>'£'+n.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
  const [step,setStep]=useState(1);
  const [form,setForm]=useState({
    name:company.name||'',logo:null,address:company.address||'',orgType:company.orgType||'',contactNumber:company.contactNumber||'',companyNumber:company.companyNumber||'',cqcId:company.cqcId||'',leadSource:company.leadSource||'',status:company.status||'Active',allowCerts:company.allowCerts!==false,allowReminders:company.allowReminders!==false,
    members:(company.members||[]).map(m=>({...m,id:m.id||Date.now()+Math.random()})),
    importFile:null,
  });
  const [errors,setErrors]=useState([]);
  const [drag,setDrag]=useState(false);
  const mbRef=useRef(null);
  const upd=p=>setForm(f=>({...f,...p}));
  const validate=s=>{const e=[];if(s===1){if(!form.name.trim())e.push('Company Name');if(!form.address.trim())e.push('Address');if(!form.orgType)e.push('Organisation Type');if(!form.contactNumber.trim())e.push('Contact Number');}if(s===2)form.members.forEach((m,i)=>{if(!m.name.trim())e.push(`Member ${i+1} Name`);if(!m.email.trim())e.push(`Member ${i+1} Email`);else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m.email))e.push(`Member ${i+1} invalid email`);});return e;};
  const goNext=()=>{const e=validate(step);if(e.length){setErrors(e);if(mbRef.current)mbRef.current.scrollTop=0;return;}setErrors([]);setStep(s=>s+1);};
  const goTo=n=>{if(n<step){setErrors([]);setStep(n);}};
  const addMember=()=>upd({members:[...form.members,{id:Date.now(),name:'',email:'',role:form.members.length===0?'Manager':'Coordinator'}]});
  const removeMember=id=>{let ms=form.members.filter(m=>m.id!==id);if(ms.length)ms=[{...ms[0],role:'Manager'},...ms.slice(1)];upd({members:ms});};
  const updMember=(id,p)=>upd({members:form.members.map(m=>m.id===id?{...m,...p}:m)});
  const handleSave=()=>onSave({...company,name:form.name,address:form.address,orgType:form.orgType,contactNumber:form.contactNumber,companyNumber:form.companyNumber,cqcId:form.cqcId,leadSource:form.leadSource,status:form.status,allowCerts:form.allowCerts,allowReminders:form.allowReminders,members:form.members});
  const SLBLS=['Details','Members','Import','Review'];
  const pendingErrs=validate(step);
  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal modal-lg" style={{maxWidth:720,maxHeight:'90vh',display:'flex',flexDirection:'column'}} onClick={e=>e.stopPropagation()}>
        <div className="mh">
          <span className="mh-title">Edit Company — {company.name}</span>
          <button className="mclose" onClick={onClose}><I n="x" s={16}/></button>
        </div>
        <div className="stepper" style={{padding:'16px 24px 0',flexShrink:0}}>
          {SLBLS.map((lbl,i)=>(
            <React.Fragment key={i}>
              {i>0&&<div className={`step-line${step>i?' done':''}`}/>}
              <div className={`step${step>=i+1?' on':''}${step>i+1?' done':''}`} onClick={()=>goTo(i+1)} style={{cursor:step>i+1?'pointer':'default'}}>
                <div className="step-circ">{step>i+1?'✓':i+1}</div>
                <span className="step-lbl">{lbl}</span>
              </div>
            </React.Fragment>
          ))}
        </div>
        {errors.length>0&&<div style={{margin:'12px 24px 0',padding:'10px 14px',background:'#FEF2F2',border:'1px solid #FECACA',borderRadius:8,display:'flex',gap:8,alignItems:'flex-start',flexShrink:0}}><I n="warn" s={14} style={{color:'var(--red)',marginTop:1,flexShrink:0}}/><div style={{fontSize:12,color:'#DC2626'}}><strong>Please fill in:</strong> {errors.join(', ')}</div></div>}
        <div className="mbody" ref={mbRef} style={{flex:1,overflowY:'auto'}}>

          {/* STEP 1: DETAILS */}
          {step===1&&(
            <div className="fg">
              <div className="fgrp full"><label className="flbl req">Company Name</label><input className="finp" type="text" placeholder="Company name" maxLength={200} value={form.name} onChange={e=>upd({name:e.target.value})}/></div>
              <div className="fgrp full"><label className="flbl">Logo</label>
                <div className="file-up" style={{cursor:'pointer'}} onClick={()=>document.getElementById('_editLogoInp').click()}>
                  <I n="upload" s={28}/>
                  {form.logo?<p style={{marginTop:8,fontSize:13,fontWeight:600,color:'var(--coral)'}}>{form.logo.name}</p>:<><p style={{marginTop:8,fontSize:13,fontWeight:600}}>Click to upload logo</p><p style={{fontSize:11,color:'var(--wg2)'}}>JPG, PNG · Max 10MB · Square crop applied</p></>}
                </div>
                <input id="_editLogoInp" type="file" accept="image/jpeg,image/png" style={{display:'none'}} onChange={e=>{const f=e.target.files[0];if(f){if(f.size>10*1024*1024){alert('Logo must be under 10MB');return;}upd({logo:f});}}}/>
              </div>
              <div className="fgrp full"><label className="flbl req">Address</label><textarea className="fta" rows={3} placeholder="Full registered address" value={form.address} onChange={e=>upd({address:e.target.value})}/></div>
              <div className="fgrp"><label className="flbl req">Organisation Type</label>
                <select className="fsel" value={form.orgType} onChange={e=>upd({orgType:e.target.value})}>
                  <option value="">Select…</option>
                  {['Care Home','Residential Care','Nursing Home','Domiciliary Care','Supported Living','Local Authority / Council','Training Consultancy / Reseller','NHS','Childcare / Nursery','Other'].map(o=><option key={o}>{o}</option>)}
                </select>
              </div>
              <div className="fgrp"><label className="flbl req">Contact Number</label><input className="finp" type="tel" placeholder="UK phone number" value={form.contactNumber} onChange={e=>upd({contactNumber:e.target.value})}/></div>
              <div className="fgrp"><label className="flbl">Companies House No.</label><input className="finp" type="text" placeholder="e.g. 12345678" value={form.companyNumber} onChange={e=>upd({companyNumber:e.target.value})}/></div>
              <div className="fgrp"><label className="flbl">CQC Registration ID</label><input className="finp" type="text" placeholder="e.g. 1-123456789" value={form.cqcId} onChange={e=>upd({cqcId:e.target.value})}/></div>
              <div className="fgrp"><label className="flbl">Lead Source</label>
                <select className="fsel" value={form.leadSource} onChange={e=>upd({leadSource:e.target.value})}>
                  <option value="">Select…</option>
                  {['CQC Register','Referral','Direct Enquiry','Marketing Campaign','Trade Show / Event','Other'].map(o=><option key={o}>{o}</option>)}
                </select>
              </div>
              <div className="fgrp"><label className="flbl">Status</label>
                <select className="fsel" value={form.status} onChange={e=>upd({status:e.target.value})}>
                  {['Free Trial','Active','Freeze','Churned'].map(o=><option key={o}>{o}</option>)}
                </select>
              </div>
              <div className="fgrp full">
                <div className="toggle-row"><span className="trow-lbl">Allow Certificates — learners can view &amp; download certificates</span><label className="toggle-sw"><input type="checkbox" checked={form.allowCerts} onChange={e=>upd({allowCerts:e.target.checked})}/><span className="tslider"/></label></div>
                <div className="toggle-row" style={{marginTop:10}}><span className="trow-lbl">Allow Reminder Emails — system sends expiry/renewal reminders</span><label className="toggle-sw"><input type="checkbox" checked={form.allowReminders} onChange={e=>upd({allowReminders:e.target.checked})}/><span className="tslider"/></label></div>
              </div>
            </div>
          )}

          {/* STEP 2: MEMBERS */}
          {step===2&&(
            <div>
              {form.members.length===0?(
                <div className="empty" style={{padding:'40px 0'}}>
                  <I n="users" s={40}/>
                  <p style={{marginTop:12,fontWeight:700,color:'var(--espresso)',fontSize:16}}>No Members Yet</p>
                  <p style={{marginTop:6,fontSize:13}}>The first member added is automatically locked as Manager</p>
                  <button className="btn btn-coral" style={{marginTop:16}} onClick={addMember}><I n="plus" s={13}/> Add Member</button>
                </div>
              ):(
                <>
                  <div style={{background:'#FFF5F2',border:'1px solid var(--coral)',borderRadius:8,padding:'10px 14px',marginBottom:16,fontSize:12,display:'flex',gap:8,alignItems:'center'}}>
                    <I n="warn" s={13} style={{color:'var(--coral)',flexShrink:0}}/>
                    <span>First member is set as <strong>Manager</strong>. Changes take effect on save.</span>
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:10}}>
                    {form.members.map((m,i)=>(
                      <div key={m.id} style={{display:'flex',gap:10,alignItems:'flex-start',padding:'12px',background:i===0?'#FFF5F2':'white',border:`1px solid ${i===0?'var(--coral)':'#E5E7EB'}`,borderRadius:10}}>
                        <div style={{display:'flex',flexDirection:'column',gap:8,flex:1}}>
                          <div style={{display:'flex',gap:8,alignItems:'center'}}>
                            {i===0&&<span style={{background:'var(--coral)',color:'white',borderRadius:20,padding:'2px 10px',fontSize:10,fontWeight:700,whiteSpace:'nowrap',flexShrink:0}}>Manager</span>}
                            <input className="finp" style={{margin:0,flex:1}} type="text" placeholder="Full name" value={m.name} onChange={e=>updMember(m.id,{name:e.target.value})}/>
                          </div>
                          <div style={{display:'flex',gap:8}}>
                            <input className="finp" style={{margin:0,flex:1}} type="email" placeholder="Email address" value={m.email} onChange={e=>updMember(m.id,{email:e.target.value})}/>
                            <select className="fsel" style={{margin:0,width:140,flexShrink:0}} value={m.role} disabled={i===0} onChange={e=>updMember(m.id,{role:e.target.value})}>
                              {i===0?<option>Manager</option>:['Coordinator','Assessor','Learner'].map(r=><option key={r}>{r}</option>)}
                            </select>
                          </div>
                        </div>
                        {i>0&&<button className="btn btn-ghost btn-sm" style={{color:'var(--red)',padding:'6px',marginTop:2,flexShrink:0}} onClick={()=>removeMember(m.id)}><I n="trash" s={13}/></button>}
                      </div>
                    ))}
                  </div>
                  <div style={{display:'flex',gap:10,marginTop:14}}>
                    <button className="btn btn-ghost btn-sm" onClick={addMember}><I n="plus" s={13}/> Add Member</button>
                    <button className="btn btn-ghost btn-sm" disabled title="Coming soon"><I n="upload" s={13}/> Bulk Upload</button>
                  </div>
                </>
              )}
            </div>
          )}

          {/* STEP 3: IMPORT */}
          {step===3&&(
            <div>
              <div style={{background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:8,padding:'10px 14px',marginBottom:16,fontSize:12,display:'flex',gap:8,alignItems:'flex-start'}}>
                <I n="warn" s={13} style={{color:'#D97706',marginTop:1,flexShrink:0}}/>
                <span>Import is optional. You can skip and manage training history from the company detail page.</span>
              </div>
              <div onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onDrop={e=>{e.preventDefault();setDrag(false);const f=e.dataTransfer.files[0];if(f){if(f.size>5*1024*1024){alert('File must be under 5MB');return;}if(!f.name.match(/\.(xlsx|csv)$/i)){alert('Only .xlsx or .csv files accepted');return;}upd({importFile:f});}}} onClick={()=>document.getElementById('_editImportInp').click()} style={{border:`2px dashed ${drag?'var(--coral)':'#CBD5E1'}`,borderRadius:12,padding:'40px 24px',textAlign:'center',cursor:'pointer',background:drag?'#FFF5F2':'white',transition:'all .2s'}}>
                {form.importFile?(<><I n="dl" s={36} style={{color:'var(--coral)'}}/><p style={{marginTop:10,fontWeight:700,color:'var(--coral)',fontSize:14}}>{form.importFile.name}</p><p style={{fontSize:11,color:'var(--wg2)',marginTop:4}}>{(form.importFile.size/1024).toFixed(1)} KB · Click to replace</p></>):(<><I n="upload" s={36} style={{color:'var(--wg2)'}}/><p style={{marginTop:10,fontWeight:700,color:'var(--espresso)',fontSize:14}}>Drag &amp; drop file here</p><p style={{fontSize:12,color:'var(--wg2)',marginTop:4}}>or click to browse</p><p style={{fontSize:11,color:'var(--wg2)',marginTop:8}}>.xlsx or .csv · Max 5MB</p></>)}
              </div>
              <input id="_editImportInp" type="file" accept=".xlsx,.csv" style={{display:'none'}} onChange={e=>{const f=e.target.files[0];if(f){if(f.size>5*1024*1024){alert('File must be under 5MB');return;}upd({importFile:f});}}}/>
              <div style={{marginTop:14,textAlign:'center'}}><button className="btn btn-ghost btn-sm"><I n="dl" s={12}/> Download Template</button></div>
            </div>

          {step===4&&(
            <div>
              <div style={{background:'#F0FDF4',border:'1px solid #BBF7D0',borderRadius:8,padding:'12px 16px',marginBottom:20,display:'flex',gap:8,alignItems:'center',fontSize:13,fontWeight:600,color:'#166534'}}>
                <I n="check" s={14}/> Review your changes before saving.
              </div>
              <div style={{marginBottom:20}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                  <div style={{fontWeight:700,fontSize:13,color:'var(--espresso)'}}>Company Details</div>
                  <button className="btn btn-ghost btn-sm" onClick={()=>goTo(1)}><I n="edit" s={11}/> Edit</button>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px 20px',background:'var(--peach)',borderRadius:10,padding:16}}>
                  {[['Company Name',form.name],['Organisation Type',form.orgType||'—'],['Contact Number',form.contactNumber],['Companies House',form.companyNumber||'—'],['CQC ID',form.cqcId||'—'],['Lead Source',form.leadSource||'—'],['Status',form.status],['Allow Certs',form.allowCerts?'Yes':'No'],['Allow Reminders',form.allowReminders?'Yes':'No']].map(([k,v])=>(
                    <div key={k}><div style={{fontSize:10,color:'var(--wg2)',fontWeight:600,textTransform:'uppercase',letterSpacing:.5}}>{k}</div><div style={{fontSize:13,fontWeight:600,color:'var(--espresso)',marginTop:2}}>{v}</div></div>
                  ))}

              </div>
              {form.members.length>0&&(

                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                    <div style={{fontWeight:700,fontSize:13,color:'var(--espresso)'}}>Members ({form.members.length})</div>
                    <button className="btn btn-ghost btn-sm" onClick={()=>goTo(2)}><I n="edit" s={11}/> Edit</button>
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    {form.members.map((m,i)=>(
                      <div key={m.id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',background:'var(--peach)',borderRadius:8}}>
                        <div style={{width:32,height:32,borderRadius:'50%',background:'var(--coral)',display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontWeight:700,fontSize:13,flexShrink:0}}>{m.name?m.name[0].toUpperCase():'?'}</div>
                        <div style={{flex:1}}><div style={{fontWeight:600,fontSize:13,color:'var(--espresso)',display:'flex',alignItems:'center',gap:6}}>{m.name||'(No name)'}{i===0&&<span style={{background:'var(--coral)',color:'white',borderRadius:20,padding:'1px 8px',fontSize:9,fontWeight:700}}>Manager</span>}</div><div style={{fontSize:11,color:'var(--wg2)',marginTop:2}}>{m.email||'(No email)'}</div></div>
                        <span className={`badge b-${m.role.toLowerCase()}`} style={{fontSize:11}}>{m.role}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {form.importFile&&(
                <div style={{marginBottom:20}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                    <div style={{fontWeight:700,fontSize:13,color:'var(--espresso)'}}>Import File</div>
                    <button className="btn btn-ghost btn-sm" onClick={()=>goTo(3)}><I n="edit" s={11}/> Change</button>
                  </div>
                  <div style={{background:'var(--peach)',borderRadius:8,padding:'10px 14px',fontSize:13,display:'flex',alignItems:'center',gap:8}}>
                    <I n="dl" s={14} style={{color:'var(--coral)'}}/><span style={{fontWeight:600,color:'var(--espresso)'}}>{form.importFile.name}</span><span style={{color:'var(--wg2)',fontSize:11}}>({(form.importFile.size/1024).toFixed(1)} KB)</span>
                  </div>
                </div>
              )}
            </div>
          )}

        </div>
        <div className="mfoot" style={{flexDirection:'column',gap:8}}>
          <div style={{width:'100%',textAlign:'center',fontSize:11,minHeight:16}}>
            {step<4&&(pendingErrs.length>0?<span style={{color:'var(--red)',fontWeight:600}}>Missing: {pendingErrs.slice(0,3).join(', ')}{pendingErrs.length>3?` +${pendingErrs.length-3} more`:''}</span>:<span style={{color:'#16A34A',fontWeight:600}}>✓ Ready to continue</span>)}
          </div>
          <div style={{display:'flex',width:'100%',alignItems:'center',gap:8}}>
            {step>1&&<button className="btn btn-ghost" onClick={()=>{setErrors([]);setStep(s=>s-1);}}><I n="cl" s={13}/> Back</button>}
            <div style={{flex:1}}/>
            <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
            {step===2&&<button className="btn btn-ghost" onClick={()=>{setErrors([]);setStep(3);}}>Skip Members</button>}
            {step===3&&<button className="btn btn-ghost" onClick={()=>{setErrors([]);setStep(4);}}>Skip Import</button>}
            {step<4&&<button className="btn btn-coral" onClick={goNext}>Next <I n="cr" s={13}/></button>}
            {step===4&&<button className="btn btn-coral" onClick={handleSave}><I n="check" s={13}/> Save Changes</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── COMPANIES LIST ── */
function Companies({companies,setCompanies,onNav,addToast,openCompany}){
  const [search,setSearch]=useState('');
  const [showFilters,setShowFilters]=useState(false);
  const [filters,setFilters]=useState({status:'all',pkg:'all',payment:'all'});
  const [sort,setSort]=useState({col:'id',dir:'desc'});
  const [page,setPage]=useState(1);
  const [menu,setMenu]=useState(null);
  const [showAdd,setShowAdd]=useState(false);
  const [editing,setEditing]=useState(null);
  const PER=15;

  useEffect(()=>{
    if(!menu)return;
    const h=()=>setMenu(null);
    document.addEventListener('click',h);
    return()=>document.removeEventListener('click',h);
  },[menu]);

  const openAdd=()=>{setEditing(null);setShowAdd(true);};
  const openEdit=(c,e)=>{e.stopPropagation();setEditing(c);setShowAdd(true);setMenu(null);};

  const handleAddSave=(newCo,planMode,xId)=>{
    setCompanies(cs=>[newCo,...cs]);
    const msg=planMode==='paid'?`${newCo.name} created — Xero invoice ${xId} generated`:`${newCo.name} created as Free Trial`;
    addToast({msg,type:'success'});
    const nCerts=(newCo.certificates||[]).length;
    if(nCerts>0){
      const active=newCo.certificates.filter(c=>c.status==='Active').length;
      const expired=nCerts-active;
      addToast({msg:`${nCerts} certificate${nCerts===1?'':'s'} auto-issued from import (${active} active, ${expired} expired)`,type:'success'});
    }
    setShowAdd(false);
  };

  const handleEditSave=(updatedCo)=>{
    setCompanies(cs=>cs.map(c=>c.id===updatedCo.id?updatedCo:c));
    addToast({msg:`${updatedCo.name} updated`,type:'success'});
    setShowAdd(false);setEditing(null);
  };

  const deleteC=(id)=>{if(confirm('Remove this company?')){setCompanies(cs=>cs.filter(c=>c.id!==id));setMenu(null);addToast({msg:'Company removed',type:'success'});}};

  let rows=[...companies].filter(c=>{
    const ms=c.name.toLowerCase().includes(search.toLowerCase());
    const mst=filters.status==='all'||c.status===filters.status;
    const mpk=filters.pkg==='all'||c.pkg===filters.pkg;
    const mpy=filters.payment==='all'||c.payment===filters.payment;
    return ms&&mst&&mpk&&mpy;
  });
  rows.sort((a,b)=>{let av=a[sort.col],bv=b[sort.col];if(typeof av==='string'){av=av.toLowerCase();bv=bv.toLowerCase();}return sort.dir==='asc'?(av>bv?1:-1):(av<bv?1:-1);});
  const total=rows.length,pages=Math.ceil(total/PER),slice=rows.slice((page-1)*PER,page*PER);
  const Th=({col,lbl})=><th onClick={()=>setSort(s=>({col,dir:s.col===col&&s.dir==='asc'?'desc':'asc'}))} style={{cursor:'pointer'}}>{lbl}{sort.col===col?sort.dir==='asc'?' ↑':' ↓':''}</th>;

  const expiring=companies.filter(c=>{if(!c.contractEnd||c.status!=='Active')return false;const d=new Date(c.contractEnd),now=new Date();return(d-now)/(1000*60*60*24)<=30;});

  return (
    <div className="content">
      {expiring.length>0 && (
        <div className="alert-banner">
          <I n="warn" s={15}/>
          <strong>{expiring.length} contracts expiring within 30 days:</strong>&nbsp;
          {expiring.slice(0,3).map(c=>c.name).join(', ')}{expiring.length>3?`, +${expiring.length-3} more`:''}
        </div>
      )}
      <div style={{display:'flex',alignItems:'center',marginBottom:16,gap:12}}>
        <div><h1 style={{fontSize:22,fontWeight:700,color:'var(--espresso)'}}>Companies</h1><p style={{fontSize:13,color:'var(--wg2)'}}>Manage care home companies and training subscriptions</p></div>
        <div style={{flex:1}}/>
        <button className="btn btn-ghost btn-sm"><I n="dl" s={13}/> Export</button>
        <button className="btn btn-ghost btn-sm" onClick={()=>setShowFilters(v=>!v)}><I n="filter" s={13}/> Filters</button>
        <button className="btn btn-coral" onClick={openAdd}><I n="plus" s={14}/> Add Company</button>
      </div>

      <div className="card">
        <div className="card-toolbar">
          <input className="search" type="text" placeholder="Search companies…" value={search} onChange={e=>{setSearch(e.target.value);setPage(1);}}/>
          <select className="sel" value={filters.status} onChange={e=>setFilters(f=>({...f,status:e.target.value}))}><option value="all">All Status</option><option value="Active">Active</option><option value="Churned">Churned</option><option value="Freeze">Freeze</option></select>
          <select className="sel" value={filters.pkg} onChange={e=>setFilters(f=>({...f,pkg:e.target.value}))}><option value="all">All Plans</option><option value="CP">CP</option><option value="CC">CC</option><option value="CP & CC">CP &amp; CC</option></select>
          <select className="sel" value={filters.payment} onChange={e=>setFilters(f=>({...f,payment:e.target.value}))}><option value="all">Payment: All</option><option value="Paid">Paid</option><option value="Pending">Pending</option><option value="Overdue">Overdue</option></select>
        </div>

        <table className="tbl">
          <thead><tr>
            <Th col="id" lbl="ID"/>
            <Th col="name" lbl="Company Name"/>
            <Th col="pkg" lbl="Plan"/>
            <Th col="sub" lbl="Billing"/>
            <th>Seats</th>
            <th>Credits</th>
            <Th col="status" lbl="Status"/>
            <Th col="payment" lbl="Payment"/>
            <Th col="contractEnd" lbl="Contract End"/>
            <th>Health</th>
            <th>Actions</th>
          </tr></thead>
          <tbody>
            {slice.map(c=>(
              <tr key={c.id}>
                <td style={{fontSize:12,color:'var(--wg2)'}}>{c.id}</td>
                <td>
                  <span className="co-name" onClick={()=>openCompany(c)}>{c.name}</span>
                  {c.xeroId&&<div style={{fontSize:10,color:'#1AB5A3',fontWeight:600,marginTop:1}}>{c.xeroId}</div>}
                </td>
                <td><span className={`badge ${c.pkg==='CP'?'b-cp':c.pkg==='CC'?'b-cc':'b-both'}`}>{c.pkg}</span></td>
                <td style={{fontSize:12,color:'var(--wg2)'}}>{c.sub}</td>
                <td>
                  {c.seats>0?(
                    <div className="sbar-wrap">
                      <div className="sbar-bg"><div className="sbar" style={{width:`${Math.min(100,Math.round(c.seatsUsed/c.seats*100))}%`}}/></div>
                      <span className="sbar-lbl">{c.seatsUsed}/{c.seats}</span>
                    </div>
                  ):<span style={{color:'var(--wg2)',fontSize:12}}>—</span>}
                </td>
                <td>
                  {c.credits>0?<span style={{fontSize:13,fontWeight:600,color:'#1E40AF'}}>{c.creditsUsed}/{c.credits}</span>:<span style={{color:'var(--wg2)',fontSize:12}}>—</span>}
                </td>
                <td><span className={`badge b-${c.status.toLowerCase()}`}>{c.status}</span></td>
                <td><span className={`badge b-${c.payment.toLowerCase()}`}>{c.payment}</span></td>
                <td style={{fontSize:12,color:new Date(c.contractEnd)<new Date(Date.now()+30*86400000)?'var(--red)':'var(--wg2)'}}>{c.contractEnd||'—'}</td>
                <td>{(()=>{const s=calcHealthScore(c);const h=healthLabel(s);return <span className={`badge ${h.c}`}>{h.l} {s}</span>})()}</td>
                <td>
                  <div className="act-wrap" onClick={e=>e.stopPropagation()}>
                    <button className="btn btn-ghost btn-sm" style={{padding:'4px 8px'}} onClick={e=>{e.stopPropagation();setMenu(menu===c.id?null:c.id);}}><I n="dots" s={14}/></button>
                    {menu===c.id&&(
                      <div className="act-menu">
                        <button className="act-item" onClick={()=>openCompany(c)}><I n="eye" s={14}/> View Details</button>
                        <button className="act-item" onClick={e=>openEdit(c,e)}><I n="edit" s={14}/> Edit Company</button>
                        <div className="act-div"/>
                        <button className="act-item danger" onClick={()=>deleteC(c.id)}><I n="trash" s={14}/> Remove</button>
                      </div>
                    )}
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        <div className="pager">
          <span className="pager-info">Showing {(page-1)*PER+1}–{Math.min(page*PER,total)} of {total}</span>
          <div className="pager-btns">
            <button className="pg" disabled={page===1} onClick={()=>setPage(p=>p-1)}><I n="cl" s={12}/></button>
            {Array.from({length:Math.min(pages,7)},(_,i)=>i+1).map(p=>(
              <button key={p} className={`pg${page===p?' on':''}`} onClick={()=>setPage(p)}>{p}</button>
            ))}
            {pages>7&&<button className="pg" disabled>…</button>}
            <button className="pg" disabled={page===pages} onClick={()=>setPage(p=>p+1)}><I n="cr" s={12}/></button>
          </div>
        </div>
      </div>

      {showAdd&&!editing&&<AddCompanyModal onSave={handleAddSave} onClose={()=>setShowAdd(false)}/>}
      {showAdd&&editing&&<EditCompanyModal company={editing} onSave={handleEditSave} onClose={()=>{setShowAdd(false);setEditing(null);}}/>}
    </div>
  );
}

/* ── OTHER SCREENS ── */

function Logs(){return <div className="content"><div style={{marginBottom:16}}><h1 style={{fontSize:22,fontWeight:700,color:'var(--espresso)'}}>Activity Logs</h1></div><div className="card"><div className="card-toolbar"><input className="search" type="text" placeholder="Search logs…"/><select className="sel"><option>All Actions</option><option>Login</option><option>Company Created</option><option>Invoice Sent</option></select><select className="sel"><option>Last 24h</option><option>Last 7 days</option><option>Last 30 days</option></select><div className="ct-space"/><button className="btn btn-ghost btn-sm"><I n="dl" s={13}/> Export</button></div><table className="tbl"><thead><tr><th>Timestamp</th><th>User</th><th>Action</th><th>Entity</th><th>IP</th><th>Details</th></tr></thead><tbody>{[{ts:'24 Apr 2026 11:32',u:'admin@ecert.co.uk',a:'Company Created',e:'Greenfield Care Home',ip:'192.168.1.45',d:'Care Professional plan, 25 seats'},{ts:'24 Apr 2026 11:15',u:'system',a:'Invoice Sent',e:'Xero INV-1198',ip:'::1',d:'£375.00 — Care Certificate, 25 credits'},{ts:'24 Apr 2026 10:58',u:'sarah.j@timbercare.co.uk',a:'Course Completed',e:'Health & Safety L2',ip:'81.145.22.101',d:'Certificate issued'},{ts:'24 Apr 2026 09:45',u:'admin@ecert.co.uk',a:'Account Locked',e:'Security Guard Services',ip:'192.168.1.45',d:'Overdue payment — auto lock'}].map((l,i)=><tr key={i}><td style={{fontSize:12,whiteSpace:'nowrap'}}>{l.ts}</td><td style={{fontSize:12,color:'var(--wg2)'}}>{l.u}</td><td><span className="badge b-cp">{l.a}</span></td><td style={{fontWeight:600,color:'var(--espresso)'}}>{l.e}</td><td style={{fontFamily:'monospace',fontSize:11,color:'var(--wg2)'}}>{l.ip}</td><td style={{fontSize:12,color:'var(--wg2)'}}>{l.d}</td></tr>)}</tbody></table></div></div>;}
function Users(){return <div className="content"><div style={{marginBottom:16}}><h1 style={{fontSize:22,fontWeight:700,color:'var(--espresso)'}}>User Management</h1></div><div className="card"><div className="card-toolbar"><input className="search" type="text" placeholder="Search users…"/><select className="sel"><option>All Roles</option><option>Learner</option><option>Manager</option><option>Admin</option></select><div className="ct-space"/><button className="btn btn-coral btn-sm"><I n="plus" s={13}/> Add User</button></div><table className="tbl"><thead><tr><th>Name</th><th>Email</th><th>Company</th><th>Role</th><th>Courses</th><th>Certs</th><th>Last Active</th><th>Active</th></tr></thead><tbody>{[{n:'Sarah Johnson',e:'sarah.j@timbercare.co.uk',c:'Timbercare Home',r:'Learner',co:12,ce:8,la:'2h ago',a:true},{n:'Michael Brown',e:'m.brown@strictlyres.co.uk',c:'Strictly Residential',r:'Manager',co:5,ce:5,la:'1d ago',a:true},{n:'Emma Wilson',e:'emma@bushcare.co.uk',c:'Bush Residential',r:'Learner',co:18,ce:14,la:'3h ago',a:true}].map((u,i)=><tr key={i}><td style={{fontWeight:600,color:'var(--espresso)'}}>{u.n}</td><td style={{fontSize:12,color:'var(--wg2)'}}>{u.e}</td><td>{u.c}</td><td><span className="badge b-cp">{u.r}</span></td><td>{u.co}</td><td>{u.ce}</td><td style={{fontSize:12,color:'var(--wg2)'}}>{u.la}</td><td><label className="toggle-sw"><input type="checkbox" defaultChecked={u.a}/><span className="tslider"/></label></td></tr>)}</tbody></table></div></div>;}
function Packs(){return <div className="content"><div style={{marginBottom:16}}><h1 style={{fontSize:22,fontWeight:700,color:'var(--espresso)'}}>Course Packs</h1></div><div className="card"><div className="card-toolbar"><input className="search" type="text" placeholder="Search packs…"/><div className="ct-space"/><button className="btn btn-coral btn-sm"><I n="plus" s={13}/> Create Pack</button></div><table className="tbl"><thead><tr><th>ID</th><th>Name</th><th>Courses</th><th>Companies</th><th>Active</th><th>Actions</th></tr></thead><tbody>{[{id:1,n:'Essential Care Training',c:12,co:245,a:true},{id:2,n:'Advanced Health & Safety',c:8,co:156,a:true},{id:3,n:'Compliance Essentials',c:15,co:312,a:true}].map(p=><tr key={p.id}><td>{p.id}</td><td style={{fontWeight:600,color:'var(--espresso)'}}>{p.n}</td><td>{p.c} courses</td><td>{p.co}</td><td><label className="toggle-sw"><input type="checkbox" defaultChecked={p.a}/><span className="tslider"/></label></td><td><div style={{display:'flex',gap:6}}><button className="btn btn-ghost btn-sm"><I n="eye" s={13}/></button><button className="btn btn-ghost btn-sm"><I n="edit" s={13}/></button></div></td></tr>)}</tbody></table></div></div>;}
function Placeholder({title}){return <div className="content"><h1 style={{fontSize:22,fontWeight:700,color:'var(--espresso)',marginBottom:8}}>{title}</h1><div className="card"><div className="empty" style={{padding:'64px 0'}}><I n="wrench" s={36}/><p style={{marginTop:12,fontWeight:700,color:'var(--espresso)',fontSize:16}}>Coming Soon</p><p style={{marginTop:4}}>This screen will be implemented in production.</p></div></div></div>;}

/* ── APP ── */
function App(){
  const [screen,setScreen]=useState('companies');
  const [companies,setCompanies]=useState(initCompanies);
  const [selectedCo,setSelectedCo]=useState(null);
  const [toasts,setToasts]=useState([]);

  const addToast=useCallback((t)=>{
    const id=Date.now();
    setToasts(ts=>[...ts,{id,...t}]);
    setTimeout(()=>setToasts(ts=>ts.filter(x=>x.id!==id)),3000);
  },[]);

  const openCompany=(c)=>{setSelectedCo(c);setScreen('company-detail');};
  const updateCompany=(updated)=>{setCompanies(cs=>cs.map(c=>c.id===updated.id?updated:c));setSelectedCo(updated);};

  // sync selectedCo with companies state
  useEffect(()=>{if(selectedCo){const fresh=companies.find(c=>c.id===selectedCo.id);if(fresh)setSelectedCo(fresh);}}, [companies]);

  const topTitle = ()=>{
    if(screen==='company-detail'&&selectedCo) return {title:'Companies',sub:selectedCo.name,back:true};
    const map={dashboard:'Dashboard',companies:'Companies',packages:'Packages',renewals:'Renewals',pricing:'Pricing Packages',logs:'Activity Logs',users:'Users',packs:'Course Packs'};
    return {title:map[screen]||screen,sub:null,back:false};
  };
  const tt=topTitle();

  return (
    <>
      <Shell screen={screen} onNav={(s)=>{setScreen(s);setSelectedCo(null);}}>
        <Topbar {...tt} onBack={()=>{setScreen('companies');setSelectedCo(null);}}/>
        {screen==='dashboard' && <Dashboard companies={companies} onNav={setScreen}/>}
        {screen==='companies' && <Companies companies={companies} setCompanies={setCompanies} onNav={setScreen} addToast={addToast} openCompany={openCompany}/>}
        {screen==='company-detail' && selectedCo && <CompanyDetail company={selectedCo} onBack={()=>setScreen('companies')} onUpdate={updateCompany} addToast={addToast}/>}
        {screen==='packages' && <Packages companies={companies} onNav={setScreen} openCompany={openCompany}/>}
        {screen==='renewals' && <Renewals companies={companies} addToast={addToast}/>}
        {screen==='pricing' && <Pricing/>}
        {screen==='logs' && <Logs/>}
        {screen==='users' && <Users/>}
        {screen==='packs' && <Packs/>}
        {!['dashboard','companies','company-detail','packages','renewals','pricing','logs','users','packs'].includes(screen) && <Placeholder title={screen.charAt(0).toUpperCase()+screen.slice(1)}/>}
      </Shell>
      <Toast toasts={toasts}/>
    </>
  );
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
